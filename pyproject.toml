[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cad-engineering-mcp"
version = "0.1.0"
description = "Persistent CAD, PCB and product engineering MCP"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]",
    "pydantic",
    "pyyaml",
    "numpy",
    "scipy",
    "trimesh",
    "shapely",
    "lxml",
    "networkx"
]

[project.scripts]
# Console entry point so the MCP server can be launched without
# absolute paths: `python -m cad_engineering_mcp` (preferred for
# development) or `cad-engineering-mcp` (after `pip install -e .`).
# The function lives in src/cad_engineering_mcp/__main__.py.
cad-engineering-mcp = "cad_engineering_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
