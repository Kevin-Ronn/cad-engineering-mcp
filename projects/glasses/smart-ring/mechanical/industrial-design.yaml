      - { name: "electrode_width", meaning: "width of a single crown electrode", value: "TBD", unit: "mm", source: "mechanical/crown-layout.yaml section 8", status: "TBD" }
      - { name: "pogo_spacing", meaning: "centre-to-centre distance between the two pogo contacts", value: "TBD", unit: "mm", source: "mechanical/pogo-charger-layout.yaml section 13", status: "TBD" }
      - { name: "pogo_diameter", meaning: "diameter of a single pogo contact pin", value: "TBD", unit: "mm", source: "mechanical/pogo-charger-layout.yaml section 13", status: "TBD" }
      - { name: "magnet_diameter", meaning: "diameter of a single charging magnet", value: "TBD", unit: "mm", source: "mechanical/pogo-charger-layout.yaml section 13", status: "TBD" }
      - { name: "magnet_height", meaning: "thickness of a single charging magnet", value: "TBD", unit: "mm", source: "mechanical/pogo-charger-layout.yaml section 13", status: "TBD" }
      - { name: "charger_recess", meaning: "shell recess that holds the pogo contacts", value: "TBD", unit: "mm", source: "mechanical/pogo-charger-layout.yaml section 13", status: "TBD" }
      - { name: "shell_thickness", meaning: "general shell wall thickness", value: "TBD (engineering estimate 0.3-0.5 mm)", unit: "mm", source: "mechanical/inner-band-layout.yaml section 8", status: "DESIGN_TARGET" }
      - { name: "inner_shell_thickness", meaning: "inner-band shell wall thickness", value: "TBD", unit: "mm", source: "industrial-design artifact", status: "DESIGN_TARGET" }
      - { name: "outer_shell_thickness", meaning: "outer-band shell wall thickness", value: "TBD", unit: "mm", source: "industrial-design artifact", status: "DESIGN_TARGET" }

  # =========================================================================
  # 18. Remaining TBD register
  # =========================================================================
  remaining_tbds:
    description: "Consolidated TBD register, deduplicated from crown-layout.yaml, inner-band-layout.yaml, pogo-charger-layout.yaml, battery-life-analysis.yaml, and component-selection files. Each TBD is classified."

    blocking_cad_tbds:
      description: "TBDs that BLOCK CAD. The CAD model cannot be parameterised without these values."
      tbds:
        - { tbd: "ring_inner_diameter (exact V1 ring size)", source: "this artifact section 2", blocking_reason: "the inner ring radius is the basis for all radial dimensions; the ring size is a marketing decision; engineering target range 16.5-22.0 mm documented" }
        - { tbd: "band_thickness (V1 final)", source: "this artifact section 2", blocking_reason: "the band thickness determines whether all components fit; the V1 stack-up is estimated at 5-7 mm; the Even R1 target is < 3 mm; the V1 may require a thicker band" }
        - { tbd: "band_width (V1 final)", source: "this artifact section 2", blocking_reason: "determines the Z range for all zones; bounded by the ring's inner circumference" }
        - { tbd: "pcb_length + pcb_width + pcb_height", source: "this artifact section 2", blocking_reason: "the PCB must fit inside the band with the components + the antenna zone + the battery zone" }
        - { tbd: "battery_length + battery_width + battery_height + battery_radius", source: "this artifact section 3", blocking_reason: "the actual V1 cell is TBD on the EEMB-class manufacturer datasheet; the engineering estimate is documented" }
        - { tbd: "crown_length + crown_width + crown_height", source: "this artifact section 2", blocking_reason: "the crown is the user-facing surface; the dimensions determine the gesture vocabulary's physical usability" }
        - { tbd: "electrode_spacing + electrode_width", source: "this artifact section 5", blocking_reason: "the IQS127D's electrode dimensions determine the gesture vocabulary's physical usability" }

    non_blocking_cad_tbds:
      description: "TBDs that do NOT block CAD. CAD can proceed with engineering targets; these TBDs are validated by prototype measurement."
      tbds:
        - { tbd: "shell_thickness + inner_shell_thickness + outer_shell_thickness", source: "this artifact section 2", non_blocking_reason: "engineering estimates documented; CAD can proceed; prototype measurement validates" }
        - { tbd: "antenna_zone_length + haptic_zone_length", source: "this artifact section 2", non_blocking_reason: "engineering estimates documented; CAD can proceed; prototype measurement validates" }
        - { tbd: "charger_recess", source: "this artifact section 2", non_blocking_reason: "depends on the pogo contact selection; CAD can proceed with an envelope" }
        - { tbd: "pogo_spacing + pogo_diameter", source: "this artifact section 2", non_blocking_reason: "depends on the selected pogo contact; CAD can proceed with envelopes" }
        - { tbd: "magnet_diameter + magnet_height", source: "this artifact section 2", non_blocking_reason: "depends on the selected magnet; CAD can proceed with envelopes" }
        - { tbd: "haptic_imu_clearance", source: "this artifact section 7", non_blocking_reason: "prototype vibration characterisation required; CAD can proceed with engineering target" }

    datasheet_tbds:
      description: "TBDs that require specific datasheet confirmation. These are not engineering assumptions; they are real uncertainties."
      tbds:
        - { tbd: "nRF54L15 per-event currents (CPU active, BLE RX, BLE TX, flash write, event duration)", source: "nRF54L15 PS v1.0", blocking_reason: "every per-event current in the BLE average current model is a TBD placeholder" }
        - { tbd: "EEMB-class LiPo cell max charge C-rate", source: "EEMB-class cell datasheet", blocking_reason: "the 22.5 mA default is the safe conservative choice; a higher rate requires cell-datasheet confirmation" }
        - { tbd: "EEMB-class cell PCM trip thresholds (overcharge V, overdischarge V, overcurrent A, short-circuit A)", source: "EEMB-class cell datasheet", blocking_reason: "over-discharge + over-current + short-circuit protection depends on these" }
        - { tbd: "EEMB-class cell NTC type + B constant", source: "EEMB-class cell datasheet", blocking_reason: "the MCP73831's NTC thresholds depend on the NTC type" }
        - { tbd: "EEMB-class cell internal resistance", source: "EEMB-class cell datasheet", blocking_reason: "the thermal analysis + charging efficiency depend on this" }
        - { tbd: "MCP73831 RPROG formula + STAT pin encodings + NTC thresholds + thermal threshold + termination current", source: "MCP73831 datasheet", blocking_reason: "the charging current setting + RR04 mapping + thermal protection depend on these" }
        - { tbd: "IQS127D electrode-to-channel mapping + scan-rate-to-current relationship + INT polarity", source: "Azoteq IQS127D datasheet", blocking_reason: "the gesture vocabulary's electrode mapping + the touch IC's power depend on these" }
        - { tbd: "BMI270 register addresses + INT1/INT2 configuration + FIFO config", source: "Bosch BMI270 datasheet", blocking_reason: "the IMU bring-up depends on these" }
        - { tbd: "TMP117 register addresses + ALERT encoding + conversion time", source: "TI TMP117 datasheet", blocking_reason: "the temperature sensor bring-up depends on these" }
        - { tbd: "MAX17048 register addresses + ALERT encoding + model load", source: "ADI MAX17048 datasheet", blocking_reason: "the fuel gauge bring-up depends on these" }
        - { tbd: "DRV2605L register addresses + waveform library + rated voltage + fault encoding", source: "TI DRV2605L datasheet", blocking_reason: "the haptic driver bring-up depends on these" }
        - { tbd: "Johanson 2450AT18B100 actual VSWR + 5 mm keepout sufficiency", source: "Johanson 2450AT18B100 datasheet + vendor reference design", blocking_reason: "the RF performance depends on this" }

    prototype_validation_tbds:
      description: "TBDs that require prototype validation. These are engineering estimates that must be measured on a prototype."
      tbds:
        - { tbd: "lra_minimum_separation_from_imu (vibration attenuation)", source: "prototype vibration characterisation" }
        - { tbd: "rotate_cw_ccw_threshold_dps", source: "prototype IMU characterisation" }
        - { tbd: "wear_put_on_imu_motion_threshold_g", source: "prototype wear-state characterisation" }
        - { tbd: "wear_taken_off_imu_stillness_threshold_g", source: "prototype wear-state characterisation" }
        - { tbd: "swipe_min_ms_lower_bound", source: "prototype gesture characterisation" }
        - { tbd: "temperature_sensor_skin_offset (thermal resistance)", source: "prototype thermal characterisation" }
        - { tbd: "comfort (final comfort validation)", source: "wear test on a prototype" }

    production_validation_tbds:
      description: "TBDs that require production-environment validation. These are certification + manufacturing concerns."
      tbds:
        - { tbd: "biocompatibility (all skin-contact materials)", source: "biocompatibility certification" }
        - { tbd: "ip_rating (final waterproofing claim)", source: "IP certification testing" }
        - { tbd: "durability (drop rating, temperature range, cycle life)", source: "production testing" }
        - { tbd: "cradle_input_overvoltage_protection", source: "cradle design (external project)", blocking_reason: "this is an EXTERNAL SYSTEM DEPENDENCY; it is NOT solved by the ring" }
        - { tbd: "emc_compliance (FCC, CE, etc.)", source: "EMC certification" }

    total_tbd_count:
      blocking_cad: 7
      non_blocking_cad: 6
      datasheet: 12
      prototype_validation: 7
      production_validation: 5
      grand_total: 37

  # =========================================================================
  # 19. CAD readiness gate
  # =========================================================================
  cad_readiness_gate:
    description: "Explicit readiness gates for CAD. Each gate is GREEN / YELLOW / RED. The overall CAD_ALLOWED determination is at the end."
    gates:
      - { gate: 1, name: "Electrical architecture", classification: "YELLOW", reason: "the architecture is complete (nRF54L15 + sensors + charger + pogo); every per-event current + register address + I2C address is TBD on the relevant datasheet; CAD does not require these TBDs" }
      - { gate: 2, name: "Battery", classification: "YELLOW", reason: "the architecture is complete (50-60 mAh preferred; 45 mAh midpoint); the actual cell is TBD on the EEMB-class manufacturer; the charging current is the safe 22.5 mA; the max charge C-rate is TBD on the cell datasheet" }
      - { gate: 3, name: "Charger", classification: "YELLOW", reason: "the architecture is complete (MCP73831 + magnetic pogo + 2 contacts); the RPROG, STAT encodings, NTC thresholds, thermal threshold are TBD on the MCP73831 datasheet" }
      - { gate: 4, name: "RF (antenna)", classification: "YELLOW", reason: "the Johanson 2450AT18B100 is selected; the placement is at Z_FINGER_END; the 5 mm keepout baseline is documented; the actual VSWR is NOT yet validated" }
      - { gate: 5, name: "Sensors (touch + IMU + temperature + fuel gauge)", classification: "YELLOW", reason: "the sensors are selected (IQS127D + BMI270 + TMP117 + MAX17048); the register addresses + bring-up details are TBD on the datasheets" }
      - { gate: 6, name: "Haptic", classification: "YELLOW", reason: "the DRV2605L + Precision Microdrives 308-101 LRA are selected; the LRA minimum separation from IMU is TBD on prototype characterisation" }
      - { gate: 7, name: "Ergonomics", classification: "YELLOW", reason: "the ring size range (US6-US13) is documented; the exact V1 size is a marketing decision; the final comfort must be validated on a prototype" }
      - { gate: 8, name: "Manufacturing", classification: "YELLOW", reason: "the manufacturing strategy is documented (prototype: SLA 3D printing + 4-layer PCB; production: injection molding + automated PCB assembly); the manufacturing engineering artifact is not yet created; the V1 does NOT commit to a specific adhesive or welding method" }
      - { gate: 9, name: "Component mechanical data", classification: "YELLOW", reason: "all components have documented packages (WLCSP, LGA, QFN); exact dimensions are TBD on the component datasheets; CAD uses parametric envelopes" }
      - { gate: 10, name: "CAD parameter freeze", classification: "YELLOW", reason: "the CAD parameter master list is created with 30+ parameters; 7 are BLOCKING CAD (the V1 must commit to specific values for these before CAD freeze); 6 are NON-BLOCKING CAD (engineering targets documented)" }

    overall_cad_allowed:
      decision: "CONDITIONAL YES"
      rationale: "the architecture is complete; the major RED items have been resolved; the remaining concerns are YELLOW (TBD on datasheets + prototype validation); CAD can proceed with engineering targets for the NON-BLOCKING parameters; the BLOCKING parameters must be committed to before CAD freeze"
      unresolved_before_cad_freeze:
        blocking_parameters_must_be_committed:
          - "ring_inner_diameter (specific V1 ring size)"
          - "band_thickness (V1 final; may be 5-7 mm rather than < 3 mm)"
          - "band_width (V1 final)"
          - "pcb_length + pcb_width + pcb_height (V1 envelopes)"
          - "battery_length + battery_width + battery_height + battery_radius (selected cell dimensions)"
          - "crown_length + crown_width + crown_height"
          - "electrode_spacing + electrode_width"
        datasheet_consultations_recommended_before_freeze:
          - "nRF54L15 PS v1.0 (per-event currents)"
          - "EEMB-class LiPo cell datasheet (max charge C-rate; PCM thresholds; NTC type; internal resistance)"
          - "MCP73831 datasheet (RPROG; STAT; NTC thresholds; thermal threshold)"
          - "IQS127D datasheet (electrode-to-channel mapping; INT polarity)"
          - "Johanson 2450AT18B100 datasheet + reference design (VSWR; 5 mm keepout sufficiency)"

  # =========================================================================
  # 20. Final engineering recommendation
  # =========================================================================
  final_engineering_recommendation:
    recommended_battery_target:
      capacity_mah: "50-60 mAh preferred if physically achievable"
      rationale: "the corrected power-budget.yaml gives approximately 3-4 days realistic runtime at 50-60 mAh under idle BLE profile; at 45 mAh the runtime is 2-3 days; the higher capacity gives more headroom for the 3-5 day target (achievable only at 50-60 mAh with idle BLE)"
      status: "the actual cell is TBD on the EEMB-class manufacturer datasheet"
    recommended_ble_interval:
      value: "30 ms"
      rationale: "the corrected power-budget.yaml gives approximately 2.5-3.5 days realistic runtime at 30 ms BLE under typical mixed-use; this is the best practical trade-off between gesture latency (~30 ms is acceptable for a controller ring) and runtime"
      alternative: "7.5 ms if lower gesture latency is required (1.5-2.5 days runtime); 100 ms if maximum runtime is required (4-5 days runtime)"
    expected_runtime:
      typical_mixed_use_30ms_ble_50_mah: "approximately 2.8 days realistic; approximately 2.0 days conservative"
      idle_ble_30ms_50_mah: "approximately 4.4 days realistic; approximately 3.1 days conservative"
      heavy_use_7.5ms_ble_45_mah: "approximately 0.8 days realistic; approximately 0.5 days conservative"
      note: "the runtime is realistic at 2-3 days under typical mixed-use at 30 ms BLE; the original 3-5 day claim is achievable only at 50-60 mAh with idle BLE profile OR with relaxed BLE interval"
    charging_strategy:
      provisional_charging_current_ma: 22.5
      rprog_resistor_kohm: 44
      charge_time_to_80pct_h: "approximately 1.6 hours"
      charge_time_to_100pct_h: "approximately 2.75 hours (including CV phase)"
      provisional_status: "the 22.5 mA charging current is the SAFE CONSERVATIVE choice pending cell datasheet confirmation of the max charge C-rate; 500 mA (the previous proposal) is UNSAFE at 11.1C for a 45 mAh cell"
      final_charging_current: "TBD on EEMB-class cell datasheet"
    pcb_architecture: "single rigid PCB in V1 (no flex); segmented rigid PCB if the bend radius exceeds the PCB manufacturer's minimum"
    antenna_location: "Johanson 2450AT18B100 at Z_FINGER_END (Z+) on the inner band (Y = -R_inner); 5 mm keepout baseline"
    haptic_location: "Precision Microdrives 308-101 LRA at Z_PALM_END (Z-) on the inner band; the LRA's flex PCB is mechanically decoupled from the main PCB by a foam gap"
    sensor_architecture:
      touch: "IQS127D at Z_CROWN (Y = +R_crown); 5 or 7 electrodes E0..E6"
      imu: "BMI270 at Z_CENTRE; offset from nRF54L15 by >= 3 mm"
      temperature: "TMP117 at Z_FINGER_END (Z+) on the inner band; thermal isolation from heat sources"
      fuel_gauge: "MAX17048 at Z_INNER near the battery"
    charging_location: "magnetic pogo at Z_PALM_END (Z-) on the inner band; 2 contacts (V+ + GND)"

    most_important_remaining_risks:
      - { risk: "EEMB-class cell max charge C-rate is TBD; the 22.5 mA safe default requires confirmation", severity: "HIGH", mitigation: "select a high-rate cell if faster charging is required; otherwise accept 1.6-2.75 hour charging time" }
      - { risk: "Johanson 2450AT18B100 5 mm keepout may be insufficient; the actual VSWR is NOT yet validated", severity: "HIGH", mitigation: "validate the VSWR on a prototype with the actual battery + LRA in place; if VSWR is unacceptable, increase the keepout" }
      - { risk: "LRA vibration coupling into BMI270 is mitigated by spatial separation + decoupling; effectiveness TBD", severity: "MEDIUM", mitigation: "prototype vibration characterisation; firmware notch filter at 175 Hz as backup" }
      - { risk: "Battery + LRA thermal coupling to the finger; the foam padding mitigates but the thermal resistance is TBD", severity: "MEDIUM", mitigation: "prototype thermal characterisation; firmware may reduce haptic frequency if the die temperature rises" }
      - { risk: "Crown overlay thickness affects capacitive-sensing range; thickness TBD on IQS127D datasheet", severity: "MEDIUM", mitigation: "validate the touch sensitivity on a prototype with the actual overlay material + thickness" }
      - { risk: "Inner band thickness affects comfort + thermal comfort; engineering target < 3 mm but V1 stack-up estimated 5-7 mm", severity: "MEDIUM", mitigation: "wear test on a prototype; the V1 may require a thicker band than the Even R1's wedding-band target" }

    begin_cad:
      decision: "CONDITIONAL YES"
      rationale: "the architecture is complete; the major RED items have been resolved; CAD can proceed with engineering targets for the NON-BLOCKING parameters; the BLOCKING parameters must be committed to before CAD freeze (see cad_readiness_gate section 19 unresolved_before_cad_freeze); the production engineering artifact + manufacturing engineering artifact are not yet created and will refine the design during production CAD"
      required_before_freeze:
        - "commit to the specific V1 ring size (one of US6-US13) or a size range"
        - "commit to the V1 PCB envelope (length + width + height)"
        - "commit to the specific EEMB-class cell (and accept the 22.5 mA safe charging current)"
        - "commit to the crown dimensions + electrode spacing"
        - "consult the IQS127D datasheet for the electrode-to-channel mapping"
      not_required_to_begin_cad:
        - "the non-blocking parameters (shell thicknesses, antenna zone, haptic zone, charger recess) can use engineering targets"
        - "the production engineering + manufacturing engineering artifacts will refine the design during production CAD"
        - "the cradle design is a separate project and does NOT block the ring's CAD"

