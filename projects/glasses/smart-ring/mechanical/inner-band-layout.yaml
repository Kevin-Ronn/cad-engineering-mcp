      - { artifact: "components/battery-selection.yaml", point: "the curved LiPo selection + the safety requirements (PCM, NTC, swelling allowance, cycle life) are mirrored" }
      - { artifact: "components/antenna-selection.yaml", point: "the Johanson 2450AT18B100 selection + the 5 mm keepout baseline + the inner-band placement are mirrored; the chip antenna's body-detuning immunity is mirrored" }
      - { artifact: "components/haptic-selection.yaml", point: "the Precision Microdrives 308-101 LRA selection + the inner-band mounting + the 175 Hz resonance + the 50 mA peak drive current are mirrored" }
