schema_version: 1
ring_sensor_interface:
  id: smart_ring_sensor_interface
  date: 2026-09-05
  status: READ-ONLY. No PCB / CAD / FreeCAD files were modified.

  note: "All sensors on the V1 ring share one I2C bus on the nRF54L15. The bus is 1.8 V; pull-up is 4.7 kohm to 1.8 V."

  i2c_bus_topology:
    bus: "I2C0 (nRF54L15)"
    speed_khz: 400  # Fast-Mode
    voltage: 1.8
    pull_up: "4.7 kohm to 1.8 V (single set for the whole bus)"
    total_devices: 5
    addresses:
      - { device: "IQS127D touch IC",         address_7bit: "0x34 or similar (verify per Azoteq datasheet)" }
      - { device: "BMI270 IMU",                 address_7bit: "0x68 (SDO = GND)" }
      - { device: "TMP117 temperature",         address_7bit: "0x48 (A0 = GND)" }
      - { device: "MAX17048 fuel gauge",         address_7bit: "0x36" }
      - { device: "DRV2605L haptic driver",      address_7bit: "0x5A (verify per TI datasheet)" }

  sensor_signal_table:
    description: "Every signal for every sensor. The column 'V1 use' indicates whether the sensor is used in V1 (controller) or V2 (controller + health)."

    - { sensor: "IQS127D touch IC",  v1: true, v2: true, signals: ["SDA (I2C)", "SCL (I2C)", "INT (GPIO input to nRF54L15; rising-edge wake)"], voltage: "1.8 V (I2C + INT)", notes: "5-7 electrode capacitive touch crown" }
    - { sensor: "BMI270 IMU",        v1: true, v2: true, signals: ["SDA (I2C)", "SCL (I2C)", "INT1 (GPIO input; rising-edge wake on motion)", "INT2 (GPIO input; data-ready interrupt)"], voltage: "1.8 V (I2C + INT)", notes: "6-axis IMU; 50 Hz ODR with FIFO" }
    - { sensor: "TMP117 temperature", v1: true, v2: true, signals: ["SDA (I2C)", "SCL (I2C)", "ALERT (GPIO input; open-drain; 10 kohm pull-up to 1.8 V)"], voltage: "1.8 V (I2C + ALERT)", notes: "1 Hz conversion; finger temperature" }
    - { sensor: "MAX17048 fuel gauge", v1: true, v2: true, signals: ["SDA (I2C)", "SCL (I2C)", "ALERT (GPIO input; open-drain; 10 kohm pull-up to 1.8 V)"], voltage: "1.8 V (I2C + ALERT)", notes: "Battery state of charge; ALERT on low battery" }
    - { sensor: "DRV2605L haptic driver", v1: true, v2: true, signals: ["SDA (I2C)", "SCL (I2C)", "EN (GPIO output; optional hardware enable)", "OUT+ (LRA+)", "OUT- (LRA-)"], voltage: "1.8 V (I2C + EN); LRA supply from VSYS (3.0-4.2 V)", notes: "8 mm LRA driver; auto-resonance tracking" }
    - { sensor: "MCP73831 charger (V1; pogo)", v1: true, v2: true, signals: ["VIN (pogo+; 5 V)", "GND (pogo-)", "BAT (LiPo cell +)", "STAT (open-drain; status; optional GPIO to nRF54L15)"], voltage: "5 V pogo (charging); 3.0-4.2 V LiPo (battery)", notes: "Magnetic pogo charging; the MCP73831 has built-in power-path management" }
    - { sensor: "BQ25185 charger (V2; if switching to inductive)", v1: false, v2: true, signals: ["VIN (inductive receiver coil)", "BAT (LiPo cell +)", "SDA (I2C)", "SCL (I2C)", "INT (GPIO input)"], voltage: "5 V inductive input; 3.0-4.2 V LiPo", notes: "V2 candidate; not used in V1" }
    - { sensor: "MAX86140 PPG (V2 only)", v1: false, v2: true, signals: ["SDA (I2C)", "SCL (I2C)", "INT (GPIO input)", "LED_RED (anode drive to external RED LED)", "LED_IR (anode drive to external IR LED)", "PD (cathode input from external photodiode)"], voltage: "1.8 V (I2C + INT); 3.3 V (LED anode supply; from VCC-3V3)", notes: "V2 only; not used in V1" }
    - { sensor: "STATUS LED", v1: true, v2: true, signals: ["LED anode (via 1 kohm resistor to GPIO)"], voltage: "1.8 V GPIO + LED forward voltage; the LED + resistor limits the current to ~1.5 mA", notes: "Visual feedback for status; charging; pairing" }
    - { sensor: "Johanson 2450AT18B100 chip antenna", v1: true, v2: true, signals: ["RF (50 ohm differential to nRF54L15's RF port)"], voltage: "n/a (RF)", notes: "On the inner band; 5 mm keepout from all other circuits" }

  gpio_allocation:
    description: "The nRF54L15 has approximately 32 GPIO. The V1 ring uses approximately 8 GPIO for the non-I2C signals. The rest are available for future expansion."

    allocation:
      - { gpio_function: "Touch IC INT",     direction: "input", pull: "rising edge; nRF54L15 internal pull-up", note: "Wake source; asserts on touch event" }
      - { gpio_function: "IMU INT1",          direction: "input", pull: "rising edge; nRF54L15 internal pull-up", note: "Wake source; asserts on motion event" }
      - { gpio_function: "IMU INT2",          direction: "input", pull: "rising edge; nRF54L15 internal pull-up", note: "Data-ready interrupt; can be used for FIFO threshold" }
      - { gpio_function: "Temperature ALERT", direction: "input", pull: "open-drain; 10 kohm pull-up to 1.8 V", note: "Optional; the V1 polls the TMP117 at 1 Hz" }
      - { gpio_function: "Fuel gauge ALERT",  direction: "input", pull: "open-drain; 10 kohm pull-up to 1.8 V", note: "Asserts on low battery" }
      - { gpio_function: "STATUS LED",        direction: "output", pull: "no", note: "Active-high; drives an LED + 1 kohm resistor to GND" }
      - { gpio_function: "Haptic driver EN",  direction: "output", pull: "no", note: "Optional; the DRV2605L has an I2C enable; the GPIO is for hardware power-down" }
      - { gpio_function: "VCC-3V3 LDO EN",   direction: "output", pull: "no", note: "Optional; the LDO can be hardware-enabled by the nRF54L15" }
      - { gpio_function: "Battery NTC (V1)",  direction: "input", pull: "n/a (analog input via SAADC; the nRF54L15's SAADC is not used in V1; the V1 uses the BQ25185's TS input OR a separate NTC; this depends on the final charging architecture)", note: "V1: BQ25185 TS input (if V1 uses BQ25185); or no NTC (if V1 uses MCP73831)" }

  known_uncertainties:
    - { item: "IQS127D I2C address", status: "verify per Azoteq datasheet" }
    - { item: "DRV2605L I2C address", status: "verify per TI datasheet" }
    - { item: "nRF54L15 GPIO count and pinout", status: "verify per the Nordic product specification v1.0; the WLCSP-2.5x2.5 mm package has limited GPIO; the V1 design must work within the available GPIO" }
    - { item: "Touch IC INT pin behavior", status: "verify per Azoteq datasheet; the IQS127D may have a dedicated INT pin or a GPIO-mapped interrupt" }

  references:
    - { ref: "components/touch-selection.yaml", url: "internal", note: "Touch IC selection" }
    - { ref: "components/imu-selection.yaml", url: "internal", note: "IMU selection" }
    - { ref: "components/temperature-selection.yaml", url: "internal", note: "Temperature sensor selection" }
    - { ref: "components/battery-selection.yaml", url: "internal", note: "Battery selection" }
    - { ref: "components/charger-selection.yaml", url: "internal", note: "Charger selection" }
    - { ref: "components/haptic-selection.yaml", url: "internal", note: "Haptic selection" }
    - { ref: "components/antenna-selection.yaml", url: "internal", note: "Antenna selection" }
