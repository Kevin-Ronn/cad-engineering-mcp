  # 12. Charging vs usage (carried over from analysis/battery-life-analysis.yaml section 13)
  # =========================================================================
  charging_vs_usage:
    description: "Carried over from the analysis; included here for completeness."
    ring_worn_while_charging: "NOT supported in V1; the cradle holds the ring"
    ble_during_charging: "ALLOW (the pogo supplies the current; OTA feasible during charging)"
    haptic_during_charging: "ALLOW"
    sensor_during_charging: "DISABLE (sensors are not useful when the ring is on the cradle)"
    ota_during_charging: "ENCOURAGE (the pogo supplies the current)"

  # =========================================================================
  # 13. Corrected claims summary
  # =========================================================================
  corrected_claims:
    description: "Final corrected claims that supersede the previous power-budget.yaml values. Each claim cites the source calculation."

    claims:
      - { claim: "Runtime at idle BLE (7.5 ms interval) at 45 mAh", value: "approximately 3.4 days realistic; 2.4 days conservative", source: "profile B idle_ble_connected + 138.6 mWh usable energy + 85% realistic factor" }
      - { claim: "Runtime at normal controller (30 ms interval) at 45 mAh", value: "approximately 2.5 days realistic; 1.8 days conservative", source: "profile C normal_controller + 138.6 mWh usable energy" }
      - { claim: "Runtime at normal controller (30 ms interval) at 60 mAh", value: "approximately 3.4 days realistic; 2.4 days conservative", source: "profile C + 184.8 mWh usable energy" }
      - { claim: "Runtime at heavy controller (7.5 ms interval) at 45 mAh", value: "approximately 0.8 days realistic; 0.5 days conservative", source: "profile D heavy_controller + 138.6 mWh usable energy" }
      - { claim: "Most realistic expected battery life at 45 mAh under typical mixed-use controller scenarios", value: "approximately 1-3 days realistic; the 'active controller' scenario with 7.5 ms BLE + sensors + haptics gives approximately 1-2 days", source: "this analysis" }
      - { claim: "Most realistic expected battery life at 60 mAh under typical mixed-use controller scenarios", value: "approximately 2-4 days realistic; the idle BLE profile gives approximately 4.5 days; the active controller profile gives approximately 2-3 days", source: "this analysis" }
      - { claim: "Conservative battery life at 45 mAh (over cell cycle life + low-battery cutoff)", value: "approximately 0.5-1.5 days under heavy use; 1-2 days under typical mixed-use", source: "this analysis; conservative_runtime = realistic * 0.70" }
      - { claim: "BLE connection interval that gives the best practical trade-off", value: "30 ms; this gives approximately 2.5-3.5 days runtime at 45 mAh under typical mixed-use (vs 1.5-2.5 days at 7.5 ms and 4-5 days at 100 ms); the gesture latency is approximately 30 ms which is acceptable for a controller ring", source: "this analysis" }
      - { claim: "3-5 days achievable without increasing battery size", value: "achievable ONLY at 60 mAh with idle BLE profile (no sensors; no haptics); NOT achievable with sensors + haptics active at 7.5 ms BLE interval; the design MUST accept that the active controller scenario gives less than 3 days at 45 mAh", source: "this analysis" }
      - { claim: "Would a buck converter materially improve runtime", value: "savings of approximately 0.5 mW (5% of the total power); NOT material; do NOT add a buck converter in V1", source: "this analysis" }
      - { claim: "Is the 35-60 mAh battery range still appropriate", value: "YES for V1 (the 35-60 mAh range is consistent with the ring form factor); the actual V1 cell capacity is TBD on the EEMB-class manufacturer datasheet; the engineering recommendation is 50-60 mAh if 3-5 day runtime is required", source: "this analysis" }
      - { claim: "Charging current", value: "22.5 mA (0.5C for 45 mAh) is the safe default; RPROG = 44 kΩ; charging time approximately 2-3 hours to 100% SOC", source: "this analysis" }

