  # =========================================================================
  # 7. Runtime re-calculation (corrected)
  # =========================================================================
  runtime_recalculation:
    description: "Recalculated runtime at 45 mAh with the corrected per-profile currents. The previous 3-5 day claim is INVALIDATED; the corrected values are based on the per-profile average current at 80% DoD."

    formulas:
      runtime_h: "(usable_energy_mwh / average_power_mW)"
      runtime_days: "runtime_h / 24"
      realistic_runtime_days: "runtime_days * 0.85 (self-discharge + low-battery cutoff margin)"
      conservative_runtime_days: "realistic_runtime_days * 0.70 (cell capacity degradation + temperature effects over cycle life)"

    results_at_45_mah_usable_138_6_mwh:
      - profile: "A deep_sleep"
        average_power_mw: 0.213
        runtime_h: "138.6 / 0.213 = 650.7 h"
        runtime_days: "27.1 days"
        realistic_days: 23.0
        conservative_days: 16.1
        classification: "CALCULATED"
      - profile: "B idle_ble_connected_7.5ms"
        average_power_mw: 1.45
        runtime_h: "138.6 / 1.45 = 95.6 h"
        runtime_days: "3.98 days"
        realistic_days: 3.39
        conservative_days: 2.37
        classification: "CALCULATED"
        note: "the idle BLE profile at 7.5 ms interval achieves approximately 3-4 days at 45 mAh; this is the ONLY profile that approaches the original 3-5 day claim"
      - profile: "C normal_controller_30ms"
        average_power_mw: 1.95
        runtime_h: "138.6 / 1.95 = 71.1 h"
        runtime_days: "2.96 days"
        realistic_days: 2.52
        conservative_days: 1.76
        classification: "CALCULATED"
      - profile: "C normal_controller_7.5ms"
        average_power_mw: 2.5
        runtime_h: "138.6 / 2.5 = 55.4 h"
        runtime_days: "2.31 days"
        realistic_days: 1.96
        conservative_days: 1.37
        classification: "CALCULATED"
      - profile: "D heavy_controller_7.5ms"
        average_power_mw: 6.22
        runtime_h: "138.6 / 6.22 = 22.3 h"
        runtime_days: "0.93 days"
        realistic_days: 0.79
        conservative_days: 0.55
        classification: "CALCULATED"
      - profile: "E ble_heavy_with_ota"
        average_power_mw: 60
        runtime_h: "138.6 / 60 = 2.31 h"
        runtime_days: "0.10 days"
        realistic_days: 0.08
        conservative_days: 0.06
        classification: "ENGINEERING_ASSUMPTION (the OTA current is TBD on the nRF54L15 PS v1.0)"
      - profile: "F haptic_heavy_use"
        average_power_mw: 2.01
        runtime_h: "138.6 / 2.01 = 68.9 h"
        runtime_days: "2.87 days"
        realistic_days: 2.44
        conservative_days: 1.71
        classification: "CALCULATED"
      - profile: "G worst_plausible_use"
        average_power_mw: 6.83
        runtime_h: "138.6 / 6.83 = 20.3 h"
        runtime_days: "0.85 days"
        realistic_days: 0.72
        conservative_days: 0.50
        classification: "CALCULATED"

    results_at_50_mah_usable_154_0_mwh:
      - profile: "B idle_ble_connected_7.5ms"
        runtime_days: "154 / 1.45 / 24 = 4.42 days"
        realistic_days: 3.76
        conservative_days: 2.63
        classification: "CALCULATED"
        note: "at 50 mAh, the idle BLE profile at 7.5 ms achieves approximately 4 days; this is within the original 3-5 day target"
      - profile: "C normal_controller_30ms"
        runtime_days: "154 / 1.95 / 24 = 3.29 days"
        realistic_days: 2.80
        conservative_days: 1.96
        classification: "CALCULATED"

    results_at_60_mah_usable_184_8_mwh:
      - profile: "B idle_ble_connected_7.5ms"
        runtime_days: "184.8 / 1.45 / 24 = 5.31 days"
        realistic_days: 4.51
        conservative_days: 3.16
        classification: "CALCULATED"
        note: "at 60 mAh, the idle BLE profile at 7.5 ms achieves approximately 5 days; this is at the upper end of the original 3-5 day target"
      - profile: "C normal_controller_30ms"
        runtime_days: "184.8 / 1.95 / 24 = 3.95 days"
        realistic_days: 3.35
        conservative_days: 2.35
        classification: "CALCULATED"

    verdict_on_3_to_5_day_claim:
      classification: "PLAUSIBLE under specific conditions; INVALID as a general claim"
      explanation: "the 3-5 day claim is achievable ONLY in the idle BLE profile (no sensors; no haptics; only the radio) AND requires 50-60 mAh; the 'active' scenarios give approximately 1-3 days; the corrected claim should be: '3-4 days at idle BLE + typical mixed use at 50-60 mAh; less than 1 day under heavy use'"
      corrected_claim: "3-4 days under typical mixed-use controller scenario at 45-50 mAh; the original 3-5 day target is achievable only at 60 mAh or with relaxed BLE interval (30 ms instead of 7.5 ms)"

  # =========================================================================
  # 8. Peak current analysis
  # =========================================================================
  peak_current_analysis:
    description: "Simultaneous peak scenarios. The peak is dominated by the LRA's 50 mA pulse; the BLE TX is brief and does not coincide with the LRA pulse (the LRA pulse is triggered by a gesture event; the BLE TX is triggered by a connection event)."

    scenarios:
      - scenario: "BLE TX peak (0 dBm) + sensor activity + LDO quiescent"
        peak_uA: "5000 (TX) + 685 (BMI270 active) + 40 (IQS127D active) + 50 (MAX17048) + 3.5 (TMP117) + 50 (LDOs) + 5 (leakage) = 5833.5 uA = 5.83 mA"
        source_artifact: "all components have documented peak currents except the BLE TX which is TBD on the nRF54L15 PS v1.0"
        classification: "CALCULATED (with TBD inputs)"
      - scenario: "LRA pulse peak (DRV2605L + LRA) + sensors + BLE RX"
        peak_uA: "50000 (LRA) + 500 (DRV2605L peak) + 685 + 40 + 50 + 3.5 + 50 + 5 + 5000 (BLE RX) = 56333.5 uA = 56.3 mA"
        classification: "CALCULATED"
      - scenario: "OTA TX peak (continuous) + sensors + LDO"
        peak_uA: "15000 (TX at +4 dBm) + 5000 (flash write) + 685 + 40 + 50 + 3.5 + 50 + 5 = 20833.5 uA = 20.8 mA"
        classification: "ENGINEERING_ASSUMPTION (the TX at +4 dBm is TBD on the nRF54L15 PS v1.0)"
      - scenario: "LRA pulse + BLE TX peak (worst plausible simultaneous)"
        peak_uA: "50000 + 500 + 685 + 40 + 50 + 3.5 + 50 + 5 + 8000 (TX at 0 dBm) = 59333.5 uA = 59.3 mA"
        classification: "CALCULATED"

    feasibility:
      tps7a02_3v3_ldo_max_ma: 200
      peak_vs_ldo_headroom_ma: 200 - 59.3 = 140.7
      nrf54l15_gpio_drive_ma_per_pin: 10
      led_drive_ma: 1.5
      lra_drive_path_independent_of_ldo: true
      lra_supply: "VBAT direct (per electrical/sensor-interface_part2.yaml section sensor_drv2605l.power_reset); the LRA's 50 mA does NOT go through the LDO"
      charging_path: "the MCP73831's 500 mA charge current is supplied by the pogo (5 V); the system current is separate"
      cell_discharge_peak_mA: 59.3
      typical_small_lipo_continuous_discharge_rating_ma: "approximately 200-500 mA; the peak is well within the typical rating"
      verdict: "the peak current is FEASIBLE for the selected components; no redesign required for peak handling"

    local_bulk_capacitance:
      description: "the 3.3 V rail should have local bulk capacitance to absorb the LRA pulse transient; the 3.3 V LDO's load transient response is slow (LDOs are not designed for fast transients)"
      recommendation: "add a 10 uF + 1 uF + 100 nF decoupling network near the DRV2605L + LRA; the bulk capacitance absorbs the pulse; TBD on the schematic"
      classification: "ENGINEERING_ASSUMPTION"

  # =========================================================================
  # 9. Charging current audit (corrected)
  # =========================================================================
  charging_current_audit:
    description: "Audit of the previous charging values. The 500 mA charging current is INVALIDATED; the safe rate is 0.5C = 22.5 mA for a 45 mAh cell."

    previous_values_audit:
      - { value: "500 mA", classification: "INVALIDATED for a 45 mAh cell (11.1C is far above typical safe rates)", correction: "default to 0.5C = 22.5 mA unless the cell datasheet approves a higher rate" }
      - { value: "0.5C", classification: "CONSERVATIVE DEFAULT; TBD on cell datasheet for the specific cell's max charge C-rate" }
      - { value: "22.5 mA", classification: "CALCULATED (0.5C for 45 mAh)" }
      - { value: "44 kΩ RPROG", classification: "CALCULATED (MCP73831 Ibat = 1000 / Rprog kΩ per the datasheet; Rprog = 1000 / 22.5 = 44.4 kΩ)" }
      - { value: "5.1 minute charge to 80%", classification: "INVALIDATED (depends on the unsafe 500 mA rate)" }

    new_values:
      selected_charging_current_ma: 22.5
      selected_c_rate: 0.5
      rprog_resistance_kohm: 44.4
      rprog_resistor_standard_value_kohm: 44  # E96 standard
      cc_phase_duration_minutes: "approximately 45 * 0.8 / 22.5 = 1.6 hours (to 80% SOC; ignoring charge losses)"
      cv_phase_duration_minutes: "TBD on cell datasheet (typically 30-60 minutes for a healthy LiPo)"
      total_charge_time_minutes: "approximately 1.6 hours CC + 30-60 minutes CV = 2.1-2.6 hours (to 100% SOC)"
      charging_efficiency_pct: "approximately 85% at low charge current (per electrical/power-budget.yaml previous section charging_time.charge_efficiency); the actual efficiency depends on the MCP73831's quiescent current vs the charge current"
      thermal_dissipation_in_mcp73831_w: "(5 V - 3.85 V) * 0.0225 A = 0.026 W; the MCP73831 dissipates approximately 26 mW during charging; the cell self-heating is approximately 0.022^2 * 0.5 = 0.00024 W; total thermal dissipation is approximately 26 mW which is negligible for finger comfort"
      verdict: "the 22.5 mA charge current is SAFE for typical small LiPo cells; the corresponding charging time is approximately 2.1-2.6 hours to 100% SOC; this is acceptable for the V1"

    if_500_ma_is_required:
      c_rate_at_500_ma_for_45_mah: 11.1
      thermal_dissipation_in_mcp73831_w_at_500_ma: "(5 - 3.85) * 0.5 = 0.575 W; this produces an UNACCEPTABLE temperature rise"
      verdict: "500 mA charging is NOT recommended unless a specific high-rate cell is selected; the V1 default is 22.5 mA"
      required_for_500_ma_approval:
        - "EEMB-class cell datasheet must confirm max charge C-rate >= 11.1C (extremely unlikely for small LiPo)"
        - "alternative: select a different cell specifically rated for high-rate charge"

  # =========================================================================
  # 10. Charger protection audit (corrected)
  # =========================================================================
  charger_protection_audit:
    description: "Explicit distinction between MCP73831 functions, cell PCM functions, and external protection requirements. Each protection is assigned to the component that actually provides it."

    protections:
      - protection: "overcharge_protection"
        provided_by: "MCP73831 (CC/CV algorithm terminates at 4.2 V) + cell PCM (redundant cut-off)"
        mcp73831_role: "primary overcharge protection"
        cell_pcm_role: "redundant backup if the MCP73831 fails"
        verdict: "GREEN"
        classification: "DATASHEET (MCP73831 termination behaviour per datasheet) + DATASHEET (PCM presence per cell)"
      - protection: "over_discharge_protection"
        provided_by: "cell PCM ONLY (cuts off at 3.0 V)"
        mcp73831_role: "NONE (the MCP73831 is not in the discharge path)"
        cell_pcm_role: "primary"
        verdict: "GREEN (depends on the PCM trip threshold; TBD on cell datasheet)"
        classification: "TBD on the exact threshold; DATASHEET on the principle"
      - protection: "overcurrent_protection (discharge)"
        provided_by: "cell PCM ONLY"
        mcp73831_role: "NONE"
        cell_pcm_role: "primary"
        verdict: "GREEN (depends on the PCM trip current; TBD on cell datasheet)"
        classification: "TBD on the exact threshold; DATASHEET on the principle"
      - protection: "short_circuit_protection"
        provided_by: "cell PCM ONLY"
        mcp73831_role: "NONE"
        cell_pcm_role: "primary"
        verdict: "GREEN (depends on the PCM trip current; TBD on cell datasheet)"
        classification: "TBD on the exact threshold; DATASHEET on the principle"
      - protection: "thermal_protection (MCP73831)"
        provided_by: "MCP73831 internal thermal regulation"
        mcp73831_role: "primary (reduces charge current on over-temperature)"
        cell_pcm_role: "NONE"
        verdict: "YELLOW (the MCP73831's thermal threshold is TBD on the datasheet)"
        classification: "TBD on the exact threshold"
      - protection: "thermal_protection (cell)"
        provided_by: "MCP73831 TS input + cell NTC thermistor"
        mcp73831_role: "monitors the NTC and reduces/stops charge on over-temperature"
        cell_pcm_role: "NONE"
        verdict: "YELLOW (the NTC type + the MCP73831's NTC thresholds are TBD on both datasheets)"
        classification: "TBD"
      - protection: "reverse_polarity_protection"
        provided_by: "magnetic polarity + mechanical key (primary; per pogo-charger-layout.yaml section 4) + MCP73831 limited reverse-polarity tolerance (backup; TBD on datasheet)"
        mcp73831_role: "limited backup"
        cell_pcm_role: "NONE"
        verdict: "YELLOW"
        classification: "ENGINEERING_ASSUMPTION (magnetic + mechanical prevention is the primary protection)"
      - protection: "input_overvoltage_protection (cradle)"
        provided_by: "cradle (TBD; separate project)"
        mcp73831_role: "limited (TBD on datasheet)"
        cell_pcm_role: "NONE"
        verdict: "RED (cradle not yet designed)"
        classification: "TBD"
      - protection: "ESD_protection (pogo contacts)"
        provided_by: "MCP73831 internal ESD diodes (TBD on datasheet rating) + optional external TVS diode (TBD on schematic)"
        verdict: "YELLOW"
        classification: "TBD on the exact rating"

    critical_audit_notes:
      - note: "the MCP73831 does NOT provide over-discharge, over-current (discharge), or short-circuit protection; these are provided EXCLUSIVELY by the cell PCM; the cell PCM is therefore MANDATORY; the MCP73831 alone is INSUFFICIENT"
        classification: "DATASHEET (principle)"
      - note: "the cell PCM trip thresholds are TBD on the cell datasheet; until the datasheet is consulted, the PCM's exact protections are UNVERIFIED"
        classification: "TBD"
      - { note: "the cradle's input overvoltage protection is RED (not yet designed); the cradle is a separate project", classification: "TBD" }

  # =========================================================================
  # 11. Low-battery policy (corrected)
  # =========================================================================
  low_battery_policy:
    description: "Conceptual SOC thresholds. The exact voltage thresholds depend on the cell's discharge curve + the cell's PCM cut-off; TBD on the cell datasheet."

    thresholds:
      - { state: "normal", soc_range_pct: "100 to 20", behaviour: "normal operation; all features available" }
      - { state: "low", soc_range_pct: "20 to 10", behaviour: "low battery notification via haptic (THREE_SHORT_PULSES per protocol/ring-gatt-spec.yaml section haptic_pattern_table); the firmware may also relax the BLE connection interval to save power" }
      - { state: "critical", soc_range_pct: "10 to 5", behaviour: "critical battery warning; the ring may disable non-essential features (haptic, LED); BLE notifications continue but at reduced cadence" }
      - { state: "shutdown", soc_range_pct: "below 5", behaviour: "the firmware initiates a clean shutdown; the nRF54L15 enters System OFF; the ring is preserved for re-charging" }
      - { state: "pcm_cutoff", soc_range_pct: "below cell-PCM threshold (TBD on cell datasheet; typically 3.0 V for LiPo)", behaviour: "the cell PCM cuts off the discharge; the ring is OFF; re-charging is required to restore operation" }
    voltage_to_soc_mapping: "TBD on cell datasheet"
    shutdown_threshold_voltage_v: "TBD on cell datasheet + MAX17048 config"

