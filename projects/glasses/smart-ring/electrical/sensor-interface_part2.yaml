  sensor_max17048:
    device_component: "Maxim Integrated (ADI) MAX17048"
    bus_interface: "I2C0 (400 kHz Fast-Mode)"
    i2c_address: { address_7bit: "0x36 (per electrical/sensor-interface.yaml; verify per ADI MAX17048 datasheet)", reason: "Per electrical/sensor-interface.yaml; the ADI datasheet is authoritative." }
    power_reset:
      supply_voltage_v: 3.0 to 4.2
      supply_rail: "VBAT (direct from the battery; the MAX17048 measures the cell voltage)"
      reset_signal: "POR (power-on-reset); no soft-reset in V1"
      power_on_sequence: "VBAT present -> the MAX17048 self-initialises; the firmware polls the chip ID after the I2C bus is alive"
    initialization_sequence:
      - "1. Wait for VBAT to be present (the MAX17048 is powered by the battery)."
      - "2. Wait for the I2C0 bus to be alive."
      - "3. Read the chip ID register (per MAX17048 datasheet; TBD address). Expected value is in the datasheet."
      - "4. Configure the ALERT pin (per MAX17048 datasheet; TBD). V1 enables ALERT on low battery threshold."
      - "5. Read the initial state of charge (SOC) to seed RR03."
      - "6. Transition to SELF_TEST (if available; TBD per MAX17048 datasheet)."
      - "7. Transition to READY; the firmware polls the SOC at 1 Hz."
    register_configuration:
      alert_threshold_register: { address: "TBD per MAX17048 datasheet (RVAL / ATLD)", value: "TBD; engineering start: ALERT at 10 percent SOC" }
      model_register: { address: "TBD per MAX17048 datasheet (MODELGAUGE)", value: "TBD; the MAX17048 uses a battery model; the model is loaded from a per-cell-characterisation table; the table content is TBD on the actual cell" }
      notes: "The model register is the most important configuration; a wrong model yields wrong SOC readings. The model is provided by the battery manufacturer (EEMB-class per components/battery-selection.yaml) and is loaded at factory provisioning."
    sampling_rate: { target_hz: 1, reason: "Per firmware/architecture.md section 4; the MAX17048's internal ADC runs continuously; the firmware polls the SOC register at 1 Hz." }
    measurement_range: { soc_percent: [0, 100], voltage_v: [0, 5], accuracy_pm: "TBD per MAX17048 datasheet (engineering start: 1 percent SOC accuracy with the model correctly loaded)" }
    resolution_data_format: { soc_resolution_percent: 1, voltage_resolution_mv: "TBD per datasheet", format: "16-bit unsigned for SOC + voltage; little-endian", notes: "The RR03 packing (8-bit percent + 2-bit charging_state + 6-bit reserved) is the BLE-level format; the internal storage is the raw 16-bit SOC." }
    interrupt_behavior:
      alert: { trigger: "SOC below ATLD threshold", wake_source: true, direction: "input to nRF54L15 GPIO; open-drain; 10 kohm pull-up to VCC-1V8", notes: "Asserts on low battery; wakes the sensor worker, which notifies RR03 with charging_state unchanged and percent decreased." }
    fifo_requirements: { external_buffer_size: "4 entries x 8 bytes (per firmware/architecture.md section 12.1 fuel-gauge alert buffer); holds the last 4 alerts" }
    timestamping_requirements:
      timestamp_source: "nRF54L15 RTC counter"
      latency_to_publish_ms: "< 5 (ALERT GPIO -> sensor worker -> BLE worker -> RR03 notify)"
    calibration_procedure:
      type: "battery model load (one-time, at factory provisioning)"
      when: "factory provisioning only; the model is not re-loaded at runtime"
      procedure: "load the MODELGAUGE register (and supporting registers) with the per-cell-characterisation table provided by the battery manufacturer (EEMB-class)"
      notes: "Per components/battery-selection.yaml; the model is the single most important configuration for the MAX17048. A wrong model yields wrong SOC; the V1 firmware will refuse to declare READY until the model is verified against the actual cell."
    startup_self_test:
      available: "TBD per MAX17048 datasheet; the MAX17048 may not have a built-in self-test"
      procedure: "the firmware verifies the model register against the expected model CRC (TBD)"
      pass_criterion: "model CRC matches the expected value"
      duration_ms: "negligible (single register read)"
    runtime_health_monitoring:
      monitored_signals: ["I2C ACK/NACK", "SOC monotonicity (SOC should not jump by > 5 percent between consecutive 1 Hz reads; if it does, the reading is flagged)", "voltage plausibility (within 3.0..4.2 V)"]
      thresholds: "TBD on prototype characterisation"
    failure_behavior:
      on_failure: "disable the fuel gauge; the ring falls back to a fixed battery model (less accurate); a TEST_DIAGNOSTIC gesture event is emitted"
      persistence: "fault_count_fg is persisted to flash"
    power_state_behavior:
      active_power_uA: 50
      sleep_power_uA: 0.5
      sleep_entry: "the MAX17048 has no sleep mode in V1; the I2C bus is the only way to reduce its current consumption"
      wake_up: "the MAX17048 is always-on in V1; its current is negligible compared to the BLE sleep current"
    firmware_abstraction:
      header_file: "drv_max17048.h (proposed; not yet created)"
      struct: "struct sm_fuelgauge_driver { sm_status_t (*init)(void); sm_status_t (*enable)(void); sm_status_t (*disable)(void); sm_status_t (*read_soc)(sm_fuelgauge_sample_t *out); sm_status_t (*verify_model)(void); }"
      sensor_id_in_manager: "SM_SENSOR_FUELGAUGE"
      ring_buffer_index: "fg_ring (per firmware/architecture.md section 12.1; 4 entries x 8 bytes = 32 B)"
      drop_counter: "drop_count_fg is not separately tracked in firmware/architecture.md section 6.1; the firmware increments a generic fault counter"

  sensor_mcp73831_charger:
    device_component: "Microchip MCP73831 (SOT-23-5)"
    bus_interface: "none (standalone; no I2C)"
    notes: "The MCP73831 is a passive charger; no firmware register configuration is required. The firmware only reads the STAT GPIO (optional) to determine the charging state."
    power_reset:
      supply_voltage_v: 3.7 to 6.5
      supply_rail: "Pogo input (5 V)"
      reset_signal: "POR"
    stat_gpio:
      direction: "input to nRF54L15 GPIO; open-drain (per electrical/sensor-interface.yaml)"
      pull: "10 kohm pull-up to VCC-1V8 (or to VBAT; TBD on schematic)"
      semantics: "LOW = charging in progress; HIGH = charge complete or no input; HIGH-Z = fault (per MCP73831 datasheet; TBD on the exact encoding)"
      notes: "The firmware reads the STAT GPIO once at boot and on every GPIO interrupt; the RR04 charging_state is derived from STAT + the fuel gauge's voltage."
    calibration_procedure: { type: "none (passive)" }
    startup_self_test: { available: false, notes: "The MCP73831 has no built-in self-test; the firmware verifies the charging state via the STAT GPIO + the fuel gauge's voltage reading." }
    runtime_health_monitoring:
      monitored_signals: ["STAT GPIO state plausibility (transitions)", "fuel gauge voltage during charging (should rise monotonically up to 4.2 V)"]
    failure_behavior:
      on_failure: "the firmware logs the fault + emits a TEST_DIAGNOSTIC gesture event; the user is expected to inspect the pogo connection"
      persistence: "fault_count_charger is not separately tracked in firmware/architecture.md section 6.1"
    power_state_behavior:
      active_power_ua: 0
      sleep_power_ua: 0
      notes: "The MCP73831 is a passive charger; its current consumption is part of the charging current, not the ring's idle current."

  sensor_drv2605l:
    device_component: "Texas Instruments DRV2605L (QFN-1.5x1.5 mm)"
    bus_interface: "I2C0 (400 kHz Fast-Mode)"
    i2c_address: { address_7bit: "TBD per TI DRV2605L datasheet; expected 0x5A", reason: "Per electrical/sensor-interface.yaml section known_uncertainties; the datasheet is authoritative." }
    power_reset:
      supply_voltage_v: "1.8 (logic) + VBAT (LRA drive)"
      supply_rail: "VCC-1V8 (logic) + VBAT (LRA drive, 3.0-4.2 V)"
      reset_signal: "soft-reset via I2C (per DRV2605L datasheet; TBD)"
      power_on_sequence: "VBAT present -> VCC-1V8 stable -> wait at least 1 ms (per DRV2605L power-on timing; TBD) -> I2C transactions may begin"
    initialization_sequence:
      - "1. Wait for VBAT + VCC-1V8 to be stable."
      - "2. Read the chip ID register (per DRV2605L datasheet; TBD address). Expected value is in the datasheet."
      - "3. Enter standby mode (per DRV2605L datasheet; TBD)."
      - "4. Configure the LRA mode (auto-resonance tracking; per DRV2605L datasheet; TBD)."
      - "5. Load the haptic waveform library into the DRV2605L's RAM from a small ROM table (per protocol/ring-gatt-spec.yaml section haptic_pattern_table). The 10 haptic IDs map to 10 DRV2605L waveform slots."
      - "6. Set the rated voltage + overdrive voltage (per LRA selection in components/haptic-selection.yaml; values TBD on prototype characterisation)."
      - "7. (Optional) enable the EN GPIO from the nRF54L15 for hardware power-down (per electrical/sensor-interface.yaml section gpio_allocation)."
      - "8. Transition to STANDBY; the DRV2605L is not active until RR05 is written."
    register_configuration:
      mode_register: { address: "TBD per DRV2605L datasheet (MODE)", value: "TBD; standby mode after load; LRA mode (vs ERM mode)" }
      library_register: { address: "TBD per DRV2605L datasheet (LIB_SEL)", value: "TBD; the LRA library (vs ERM library)" }
      waveform_slot_register: { address: "TBD per DRV2605L datasheet (WAV_FRM_x)", value: "TBD; per-slot waveform definition; 10 slots for the 10 haptic IDs" }
      rated_voltage_register: { address: "TBD per DRV2605L datasheet (RATED_VOLTAGE)", value: "TBD per LRA; engineering start per components/haptic-selection.yaml" }
      notes: "All register addresses TBD until the DRV2605L datasheet is consulted."
    sampling_rate: { target_hz: "event-driven; the DRV2605L is not polled; it is driven by the BLE worker on RR05 writes" }
    measurement_range: { lra_drive_voltage_v: [2.0, 3.5], lra_drive_current_ma: [0, 200], notes: "Per components/haptic-selection.yaml; the DRV2605L has built-in over-current protection" }
    resolution_data_format: { waveform_slot: "8-bit (one slot per haptic_id); per firmware/architecture.md section 9.1", notes: "The DRV2605L's waveform library is closed-loop; the firmware writes a slot index + intensity, the DRV2605L drives the LRA with auto-resonance tracking" }
    interrupt_behavior:
      fault_gpio: { trigger: "over-current, under-voltage, over-temperature (per DRV2605L datasheet)", wake_source: true, direction: "input to nRF54L15 GPIO; per DRV2605L datasheet TBD", notes: "The DRV2605L reports faults via the INT pin; the firmware transitions the haptic manager to a fault state and emits a TEST_DIAGNOSTIC gesture event." }
    fifo_requirements:
      notes: "The DRV2605L is a single-waveform-at-a-time device; the FIFO lives in the haptic manager (per firmware/architecture.md section 9.4; 4 entries x 8 bytes)."
    timestamping_requirements:
      timestamp_source: "nRF54L15 RTC counter"
      latency_to_drive_ms: "< 15 (RR05 write -> BLE worker -> haptic manager -> I2C -> LRA drive; per firmware/architecture.md section 4)"
    calibration_procedure:
      type: "auto-resonance tracking (the DRV2605L does this at runtime; no factory calibration required)"
      when: "every time a waveform is played; the DRV2605L measures the LRA's resonant frequency and adjusts the drive frequency"
      notes: "Per components/haptic-selection.yaml; the auto-resonance tracking is the DRV2605L's built-in feature."
    startup_self_test:
      available: "TBD per DRV2605L datasheet; the DRV2605L may have a built-in self-test for the LRA driver"
      procedure: "TBD"
      pass_criterion: "TBD"
      duration_ms: "TBD"
    runtime_health_monitoring:
      monitored_signals: ["I2C ACK/NACK", "fault GPIO assertions", "LRA drive current plausibility"]
      thresholds: "TBD on prototype characterisation"
    failure_behavior:
      on_failure: "disable the haptic driver; the ring continues to operate (no haptic); a TEST_DIAGNOSTIC gesture event is emitted"
      persistence: "fault_count_haptic is persisted to flash"
    power_state_behavior:
      active_power_ua: 500
      sleep_power_ua: 1
      sleep_entry: "write DRV2605L MODE register to standby (per datasheet TBD)"
      wake_up: "write DRV2605L MODE register to active; wait for the device-ready bit (per datasheet TBD)"
    firmware_abstraction:
      header_file: "drv_drv2605l.h (proposed; not yet created)"
      struct: "struct sm_haptic_driver { sm_status_t (*init)(void); sm_status_t (*play)(uint8_t slot, uint8_t intensity); sm_status_t (*stop)(void); sm_status_t (*fault)(void); }"
      sensor_id_in_manager: "SM_SENSOR_HAPTIC (not a sensor in the strict sense; the haptic manager owns the FIFO + arbitration)"
      ring_buffer_index: "haptic_fifo (per firmware/architecture.md section 12.1; 4 entries x 8 bytes = 32 B)"
      drop_counter: "fault_count_haptic (uint16; per firmware/architecture.md section 6.5)"

  wear_detection_inputs:
    description: "V1 wear-state detection uses a composite of IQS127D touch presence + BMI270 stillness. There is no dedicated skin-contact electrode in V1 (that is V2 per components/ppg-selection.yaml section V2). The wear-state is a derived state, not a direct sensor reading."
    inputs:
      - { source: "IQS127D touch presence", signal: "any electrode reports TOUCH_PRESS sustained for at least wear_off_to_on_debounce_ms (100 ms; per protocol/gesture-vocabulary.yaml section global_constants)", role: "primary wear-state confirmation" }
      - { source: "BMI270 acceleration", signal: "peak acceleration in the last 200 ms above wear_put_on_imu_motion_threshold_g (TBD on prototype characterisation)", role: "secondary wear-state confirmation; prevents accidental WEAR_PUT_ON from a static touch on a flat surface" }
      - { source: "BMI270 stillness", signal: "peak acceleration in the last 30 s below wear_taken_off_imu_stillness_threshold_g (TBD) AND no touch event for at least 5 s", role: "wear-state off confirmation" }
    bring_up:
      - "No dedicated hardware bring-up beyond the IQS127D + BMI270 bring-up. The wear-state manager subscribes to the touch + IMU ring buffers (per firmware/architecture.md section 2.4)."
      - "Initial wear_state at boot is WEAR_OFF."
      - "The wear-state manager runs on the sensor worker (per firmware/architecture.md section 3.2)."
    calibration_procedure:
      type: "no separate calibration; the wear-state thresholds are derived from the IMU + touch calibration"
      notes: "The wear-state thresholds (wear_put_on_imu_motion_threshold_g, wear_taken_off_imu_stillness_threshold_g) are TBD per protocol/gesture-vocabulary.yaml section unresolved_gesture_parameters."
    firmware_abstraction:
      header_file: "wear_state.h (proposed; not yet created)"
      struct: "the wear-state is a derived state, not a sensor; it has no sensor_id_in_manager; it lives in the gesture FSM (per firmware/architecture.md section 5)"
      ring_buffer_index: "n/a (derived state)"

  sensor_max86140_v2_only:
    device_component: "Maxim Integrated MAX86140 (OLGA-3.1x4.7x0.8 mm)"
    bus_interface: "I2C0 (400 kHz Fast-Mode)"
    i2c_address: { address_7bit: "TBD per Maxim MAX86140 datasheet", reason: "V2 only; no V1 hardware bring-up; address TBD until the schematic exists." }
    v1_status: "EXCLUDED from V1 hardware per components/ppg-selection.yaml section V1 and electrical/system-architecture.yaml section note. This section is a placeholder for forward compatibility; no V1 bring-up sequence exists."
    v2_forward_compatibility_notes:
      - "The V2 PCB adds a MAX86140 + RED LED + IR LED + photodiode on the inner band (per components/ppg-selection.yaml section V2)."
      - "The V2 software adds a motion-artifact filter (IMU data cancels the motion artifact) and an HR / SpO2 / HRV algorithm."
      - "The V2 sensor placement is the same as NERVA_Ring's (inner band, between the IMU and the touch IC)."
      - "The V2 sensor manager will register the MAX86140 as SM_SENSOR_PPG and the existing portable sensor manager + drop-counter + sequence-gap accounting infrastructure is reused."
      - "The V2 GATT characteristic RR09 (PPG HR) is already defined in protocol/ring-gatt-spec.yaml."
    reason_v1_excluded: "V1 is controller-only per the brief; adding PPG increases PCB area (3.1 x 4.7 mm), power (LED anode current 5-20 mA), and software complexity (motion-artifact filter) for a feature that is not on the V1 critical path."
    known_uncertainties: ["MAX86140 register addresses", "MAX86140 I2C address", "LED current setting", "photodiode selection", "motion-artifact filter algorithm parameters", "RR09 notify cadence"]

  bring_up_timing_budget:
    description: "Total time from power-on to all sensors READY. The budget is bounded by the slowest device's bring-up sequence."
    estimate:
      - { step: "VBAT present + VCC-1V8 stable", duration_ms: "TBD on LDO PG GPIO timing; engineering start: 5 ms" }
      - { step: "VCC-3V3 stable", duration_ms: "TBD; engineering start: 5 ms" }
      - { step: "I2C0 bus alive", duration_ms: 1 }
      - { step: "MAX17048 chip ID read + model verify", duration_ms: "TBD on MAX17048 I2C speed; engineering start: 10 ms" }
      - { step: "TMP117 chip ID read + first conversion", duration_ms: "TBD; engineering start: 15 ms (conversion takes a few ms; TBD on datasheet)" }
      - { step: "BMI270 chip ID read + soft-reset + config file load + FIFO config + interrupt config + first self-test", duration_ms: "TBD on BMI270 init timing; engineering start: 50 ms (config file load is the bulk)" }
      - { step: "IQS127D chip ID read + electrode config + threshold config + scan rate + INT config", duration_ms: "TBD on IQS127D init timing; engineering start: 20 ms" }
      - { step: "DRV2605L chip ID read + mode config + waveform library load + rated voltage config", duration_ms: "TBD on DRV2605L init timing; engineering start: 30 ms" }
      - { step: "IMU calibration (if WEAR_OFF + stillness detected)", duration_ms: "TBD; engineering start: 2000 ms (2 s of stillness)" }
      - { step: "Total (worst case, with calibration)", duration_ms: "approximately 2150 ms; subject to prototype measurement" }
      - { step: "Total (typical, calibration deferred to first WEAR_TAKEN_OFF)", duration_ms: "approximately 150 ms" }
    notes: "The total bring-up time is dominated by the IMU calibration. The V1 firmware declares all sensors READY after the calibration window closes; if the calibration is DEFERRED, the IMU is DEGRADED until the first calibration completes."

  power_state_summary:
    description: "How each sensor behaves in the V1 power states (per firmware/architecture.md section 8.1)."
    table:
      - { state: "BOOT",          sensors: ["all OFF except VBAT-powered"] }
      - { state: "PAIRING",       sensors: ["BLE on; sensors still OFF (advertising only)"] }
      - { state: "CONNECTED_IDLE", sensors: ["MAX17048 ON (1 Hz poll); DRV2605L standby; others OFF"] }
      - { state: "CONNECTED_ACTIVE", sensors: ["IQS127D scanning 100 Hz; BMI270 FIFO 50 Hz; TMP117 1 Hz; MAX17048 1 Hz; DRV2605L standby"] }
      - { state: "IDLE",          sensors: ["MAX17048 ON; others OFF"] }
      - { state: "GESTURE",       sensors: ["IQS127D scanning; BMI270 FIFO; others OFF"] }
      - { state: "HAPTIC",        sensors: ["DRV2605L active; others OFF"] }
      - { state: "SENSING",       sensors: ["BMI270 FIFO; others OFF (V2 only)"] }
      - { state: "SLEEP",         sensors: ["all OFF; nRF54L15 System OFF"] }
      - { state: "CHARGING",      sensors: ["MCP73831 charging; nRF54L15 System OFF (pogo insertion is a wake source via STAT GPIO)"] }
      - { state: "OTA",           sensors: ["all OFF except the BLE DFU"] }
      - { state: "SHIPPING",      sensors: ["all OFF; nRF54L15 in deep power-down with GPIO lock"] }

