schema_version: 1
ring_sensor_interface_part2:
  id: smart_ring_sensor_interface_part2
  date: 2026-09-05
  status: READ-ONLY. No PCB / CAD / KiCad / FreeCAD / firmware source code is created by this artifact.
  parent_artifacts:
    - "electrical/sensor-interface.yaml"
    - "electrical/system-architecture.yaml"
    - "firmware/architecture.md"
    - "protocol/gesture-vocabulary.yaml"
    - "components/*-selection.yaml"

  note: "Companion to electrical/sensor-interface.yaml. That file defines the wiring (which signals go where); this file defines the per-sensor bring-up sequence (how the firmware initialises, calibrates, monitors, and recovers each sensor). The two files share the same I2C addresses and voltage rails. If they disagree, sensor-interface.yaml is authoritative for wiring; this file is authoritative for software behavior."

  v1_sensor_scope:
    description: "V1 sensors retained in the architecture per electrical/system-architecture.yaml and components/*-selection.yaml. PPG is V2-only and is documented here as a forward-compatibility placeholder (no V1 hardware bring-up)."
    v1_sensors:
      - { sensor: "BMI270 IMU",              component: "components/imu-selection.yaml",        reason: "Primary IMU; used for gestures (ROTATE_*) + wear-state stillness detection + (V2) PPG motion-artifact cancellation" }
      - { sensor: "IQS127D touch IC",        component: "components/touch-selection.yaml",      reason: "Capacitive touch crown; 5-7 electrodes; provides TAP, DOUBLE_TAP, LONG_PRESS, SWIPE_* + wear-state touch presence" }
      - { sensor: "TMP117 temperature",      component: "components/temperature-selection.yaml", reason: "Finger temperature; 1 Hz conversion; RR08 in V2 (V1 stores internally; not exposed via BLE)" }
      - { sensor: "MAX17048 fuel gauge",     component: "components/battery-selection.yaml",    reason: "Battery state of charge + low-battery ALERT for RR03 + power-manager decisions" }
      - { sensor: "DRV2605L haptic driver",   component: "components/haptic-selection.yaml",     reason: "LRA driver for RR05 haptic patterns" }
      - { sensor: "MCP73831 charger (passive)", component: "components/charger-selection.yaml", reason: "Standalone charger IC; passive (no I2C); STAT GPIO optional" }
    v2_only_or_excluded:
      - { sensor: "MAX86140 PPG",             component: "components/ppg-selection.yaml",        reason: "V2-only; no V1 hardware bring-up; see section 5 placeholder" }

  global_bring_up_order:
    description: "The order in which sensors are brought up at boot. The order is determined by hard dependencies (I2C bus availability, power-rail sequencing) and soft dependencies (calibration prerequisites)."
    sequence:
      - { step: 1,  sensor: "power rails",        action: "Power manager enables VCC-1V8 LDO first; VCC-3V3 LDO after VCC-1V8 is stable (per electrical/power-tree.yaml). Wait for PG (power-good) GPIO from each LDO." }
      - { step: 2,  sensor: "I2C0 bus",          action: "Zephyr I2C driver initialises I2C0 at 400 kHz Fast-Mode. Probe bus with a broadcast address read; record ACK/NACK for every 7-bit address 0x00..0x7F." }
      - { step: 3,  sensor: "MAX17048 fuel gauge", action: "First device on the bus because it is the simplest I2C device; provides early battery-status visibility for the rest of the boot." }
      - { step: 4,  sensor: "TMP117 temperature", action: "Second simple I2C device; one-shot conversion at boot to validate the sensor + I2C bus." }
      - { step: 5,  sensor: "BMI270 IMU",        action: "Initialised after the temperature sensor because the IMU is the most power-sensitive device. Bring-up includes FIFO config + INT1/INT2 setup." }
      - { step: 6,  sensor: "IQS127D touch IC",  action: "Initialised after the IMU. Touch IC electrode scanning begins only after the wear-state is WEAR_OFF (no false-positive touch events during boot)." }
      - { step: 7,  sensor: "DRV2605L haptic driver", action: "Initialised last among the bus devices; loads the haptic waveform library from a small ROM table (per protocol/ring-gatt-spec.yaml section haptic_pattern_table). Initialised in standby; no haptic until RR05 is written." }
      - { step: 8,  sensor: "MCP73831 charger",   action: "No firmware initialisation required (passive). The STAT GPIO is read once to determine initial charging_state; subsequent transitions are interrupt-driven." }
      - { step: 9,  sensor: "wear-state manager", action: "Set initial wear_state to WEAR_OFF; wait for WEAR_PUT_ON candidate from the gesture FSM." }
      - { step: 10, sensor: "BLE stack",         action: "Zephyr BLE host initialises; advertising begins; first CCCD write from the central starts the notify pipeline." }
    dependencies:
      - { dependent: "IQS127D",  requires: ["VCC-1V8", "I2C0"] }
      - { dependent: "BMI270",   requires: ["VCC-1V8", "I2C0"] }
      - { dependent: "TMP117",   requires: ["VCC-1V8", "I2C0"] }
      - { dependent: "MAX17048", requires: ["VBAT (or VSYS)", "I2C0"] }
      - { dependent: "DRV2605L", requires: ["VBAT (for LRA drive)", "VCC-1V8 (logic)", "I2C0"] }
      - { dependent: "MCP73831", requires: ["Pogo input OR VBAT"] }
      - { dependent: "MAX86140 (V2 only)", requires: ["VCC-1V8 (logic)", "VCC-3V3 (LED anode)", "I2C0"] }

  bring_up_state_machine:
    description: "Per-sensor state machine. Each sensor transitions through these states during bring-up. The sensor manager declares a sensor READY only after SELF_TEST and CALIBRATING (if any) have completed. The state machine mirrors firmware/architecture.md section 10 error handling (DEGRADED + FAILED are persistent)."
    states:
      - { state: "OFF",          description: "Sensor has no power; firmware has not initialised any register." }
      - { state: "POWERED",      description: "Power rail stable; sensor is out of reset; I2C bus is alive; firmware has not yet written any configuration register." }
      - { state: "RESET",        description: "Firmware is writing the soft-reset sequence; sensor is not yet accepting other commands." }
      - { state: "INITIALIZING", description: "Firmware is writing the configuration registers (range, ODR, FIFO, interrupts, etc.)." }
      - { state: "SELF_TEST",    description: "Firmware is running the sensor's built-in self-test (if any). Self-test result must pass before READY." }
      - { state: "CALIBRATING",  description: "Firmware is collecting calibration data (e.g. gyro zero-rate, accelerometer static magnitude, touch electrode baselines). Some sensors require a 'still' period; the calibration procedure depends on the sensor." }
      - { state: "READY",        description: "Sensor is fully operational; samples flow into the portable sensor manager; the gesture FSM may consume them." }
      - { state: "DEGRADED",     description: "Sensor is operational but with reduced confidence (e.g. self-test marginal; calibration incomplete; I2C retries > threshold). The sensor manager increments the per-sensor fault counter but does NOT disable the sensor." }
      - { state: "FAILED",       description: "Sensor has failed (self-test fail; I2C NACK; out-of-range reading). The sensor manager disables the sensor, increments fault_count_<sensor>, and emits a TEST_DIAGNOSTIC gesture event per firmware/architecture.md section 10.1." }
    state_transitions:
      - { from: "OFF",          event: "power rail good",                              to: "POWERED" }
      - { from: "POWERED",      event: "firmware writes reset sequence",               to: "RESET" }
      - { from: "RESET",        event: "reset sequence complete (chip ID read OK)",    to: "INITIALIZING" }
      - { from: "INITIALIZING", event: "configuration registers written",              to: "SELF_TEST" }
      - { from: "SELF_TEST",    event: "self-test passed",                             to: "CALIBRATING" }
      - { from: "SELF_TEST",    event: "self-test failed",                             to: "FAILED" }
      - { from: "CALIBRATING",  event: "calibration complete",                         to: "READY" }
      - { from: "CALIBRATING",  event: "calibration timeout (no stillness detected)",  to: "DEGRADED" }
      - { from: "READY",        event: "runtime fault (3+ I2C retries in 60 s)",       to: "DEGRADED" }
      - { from: "READY",        event: "sensor I2C NACK for 5 retries",                to: "FAILED" }
      - { from: "DEGRADED",     event: "fault clears after 60 s of normal operation",  to: "READY" }
      - { from: "DEGRADED",     event: "fault worsens",                                to: "FAILED" }
      - { from: "FAILED",       event: "firmware explicit reset",                      to: "POWERED" }

  sensor_bmi270:
    device_component: "Bosch BMI270 (LGA-2.5x3.0x0.8 mm)"
    bus_interface: "I2C0 (400 kHz Fast-Mode)"
    i2c_address: { address_7bit: "TBD per Bosch BMI270 datasheet; expected 0x68 (SDO=GND)", reason: "The datasheet is the authoritative source for the I2C address. The system-architecture.yaml assumption 0x68 is unverified." }
    power_reset:
      supply_voltage_v: 1.8
      supply_rail: "VCC-1V8"
      reset_signal: "soft-reset via register (per BMI270 datasheet CMD register); no hardware reset pin used in V1"
      power_on_sequence: "VCC-1V8 stable -> wait at least 1 ms (per BMI270 power-on timing; TBD on datasheet) -> I2C transactions may begin"
      notes: "BMI270 has a power-on-reset delay; the firmware must wait before the first I2C transaction. Exact delay is in the BMI270 datasheet (TBD until confirmed)."
    initialization_sequence:
      - "1. Wait for VCC-1V8 to be stable (LDO PG GPIO asserts)."
      - "2. Wait the BMI270 power-on delay (datasheet TBD)."
      - "3. Read the chip ID register (per BMI270 datasheet; TBD address). Expected value is in the datasheet; if not, the sensor is not present."
      - "4. Issue the soft-reset command (CMD register; per datasheet)."
      - "5. Wait for the reset to complete (poll the status register; per datasheet TBD)."
      - "6. Load the sensor's configuration file (the BMI270 requires a configuration file to be loaded into its internal RAM; the file content is Bosch-proprietary and must be downloaded from Bosch's website; the exact file version is TBD)."
      - "7. Enable the FIFO (per FIFO requirements below)."
      - "8. Enable INT1 + INT2 with the desired trigger sources (per interrupt_behavior below)."
      - "9. Set the accelerometer + gyroscope ODR and range (per sampling_rate and measurement_range)."
      - "10. Transition to SELF_TEST."
    register_configuration:
      odr_register: { address: "TBD per BMI270 datasheet (ACC_CONF + GYR_CONF)", value: "TBD; 50 Hz for both accel and gyro is the V1 target (per firmware/architecture.md section 4)" }
      range_register: { address: "TBD per BMI270 datasheet (ACC_RANGE + GYR_RANGE)", value: "TBD; accel +/- 4 g; gyro +/- 2000 dps are engineering starting points; subject to hardware characterisation" }
      fifo_config_register: { address: "TBD per BMI270 datasheet (FIFO_CONFIG_0 + FIFO_CONFIG_1)", value: "TBD; header mode + watermark interrupt; V1 target is 1 KB FIFO with watermark at 50 percent" }
      int1_map: { address: "TBD per BMI270 datasheet (INT1_IO_CTRL + INT1_MAP)", value: "TBD; FIFO watermark on INT2; motion-any on INT1" }
      int2_map: { address: "TBD per BMI270 datasheet (INT2_IO_CTRL + INT2_MAP)", value: "TBD; data-ready on INT2 (optional)" }
      notes: "Every register address and value is marked TBD because the BMI270 datasheet is the only authoritative source. The firmware driver uses the BMI270's official driver API in preference to raw register writes (per research/license-audit.md; the BMI270 has mainline Linux IIO support)."
    sampling_rate: { target_hz: 50, reason: "Per firmware/architecture.md section 4 sensor acquisition timing. BMI270 supports up to 6400 Hz; 50 Hz is sufficient for ROTATE_CW/ROTATE_CCW recognition." }
    measurement_range: { accel_g_pm: "TBD (engineering start: +/- 4 g)", gyro_dps_pm: "TBD (engineering start: +/- 2000 dps)", reason: "Subject to hardware characterisation; the V1 ring's expected motion profile (gestures + wrist motion) drives the range selection." }
    resolution_data_format: { resolution_bits: 16, endianness: "little-endian", format: "two's complement; signed 16-bit per axis per sensor (accel x/y/z, gyro x/y/z)", notes: "BMI270 natively outputs 16-bit signed values; the portable sensor manager wraps them in sm_sample_header_t." }
    interrupt_behavior:
      int1:
        trigger: "FIFO watermark; motion-any (accel magnitude above threshold)"
        wake_source: true
        direction: "input to nRF54L15 GPIO; rising-edge; firmware samples the IMU FIFO on wake"
        notes: "INT1 wakes the nRF54L15 from System ON idle."
      int2:
        trigger: "FIFO watermark (alternate); data-ready"
        wake_source: true
        direction: "input to nRF54L15 GPIO; rising-edge"
        notes: "INT2 may be used for FIFO threshold; both INTs map to the sensor worker."
      latched_vs_pulsed: "TBD per BMI270 datasheet (latched is preferred; the firmware polls the FIFO on every INT1/INT2 wake)"
    fifo_requirements: { fifo_bytes: 1024, mode: "header mode (per BMI270 datasheet; TBD register); V1 FIFO is 1 KB; watermark at 50 percent (512 bytes)", frames_per_second: "at 50 Hz with 6 axes + 1 timestamp, approx 12 bytes per frame => about 50 frames in 1 second => about 600 bytes; the 1 KB FIFO holds about 1.6 seconds", notes: "FIFO overflow triggers DEGRADED state and drop_count_imu increment per firmware/architecture.md section 6.2." }
    timestamping_requirements:
      timestamp_source: "nRF54L15 RTC counter (per firmware/architecture.md section 2.3 common timestamping); 1 microsecond resolution after prescaler"
      timestamping_in_driver: "the BMI270's internal timestamp (per its datasheet; TBD) is captured in the FIFO header; the firmware merges it with the RTC timestamp at sample-publish time"
      latency_to_publish_us: "< 100 (ISR -> sensor worker -> sm_publish)"
    calibration_procedure:
      type: "static accelerometer magnitude + gyro zero-rate"
      when: "during boot if wear_state == WEAR_OFF and IMU has been still for at least 30 s; otherwise the calibration is DEFERRED to the first WEAR_PUT_ON -> WEAR_TAKEN_OFF cycle"
      accelerometer_calibration: "sample the accelerometer for 2 seconds at 50 Hz with the ring lying still; verify that the magnitude is within 1 g +/- 0.05 g; if not, calibration FAILS and the sensor transitions to DEGRADED"
      gyroscope_calibration: "sample the gyroscope for 2 seconds at 50 Hz with the ring lying still; compute the mean of each axis; store the mean as the zero-rate offset; the offset is subtracted from every gyro sample at runtime"
      notes: "The calibration parameters are stored in sm_cal_t in static memory (per firmware/architecture.md section 2.3); they persist across reboot via the Zephyr settings subsystem."
    startup_self_test:
      available: true
      procedure: "per BMI270 datasheet (TBD register sequence); the self-test verifies the accelerometer + gyroscope MEMS elements"
      pass_criterion: "datasheet-defined threshold (TBD); on fail, transition to FAILED"
      duration_ms: "TBD per BMI270 datasheet; typically < 100 ms"
    runtime_health_monitoring:
      monitored_signals: ["I2C ACK/NACK", "FIFO watermark hit rate", "sample magnitude plausibility", "self-test on every reboot"]
      thresholds: "all TBD on prototype characterisation; the portable sensor manager counts failures per firmware/architecture.md section 10.1; > 10 failures in 60 s triggers DEGRADED; sensor I2C NACK for 5 retries triggers FAILED"
    failure_behavior:
      on_failure: "disable the IMU; emit a TEST_DIAGNOSTIC gesture event with payload describing the fault (per firmware/architecture.md section 10.1); the ring continues to operate with the touch-only gestures"
      persistence: "fault_count_imu is persisted to flash; survives reboot"
    power_state_behavior:
      active_power_uA: 685
      sleep_power_uA: 3
      sleep_entry: "write BMI270 power-mode register to 'suspend' (per datasheet TBD)"
      wake_up: "write BMI270 power-mode register to 'normal'; wait for ODR-stable bit (per datasheet TBD); duration < 10 ms"
    firmware_abstraction:
      header_file: "drv_bmi270.h (proposed; not yet created)"
      struct: "struct sm_imu_driver { sm_status_t (*init)(void); sm_status_t (*enable)(void); sm_status_t (*disable)(void); sm_status_t (*read_fifo)(sm_sample_t *out, uint16_t max_samples); sm_status_t (*self_test)(void); sm_status_t (*calibrate)(void); void (*irq_handler)(void); }"
      sensor_id_in_manager: "SM_SENSOR_IMU"
      ring_buffer_index: "imu_ring (per firmware/architecture.md section 12.1; 100 samples x 32 bytes = 3.2 KB)"
      drop_counter: "drop_count_imu (uint16; per firmware/architecture.md section 6.1)"

  sensor_iqs127d:
    device_component: "Azoteq IQS127D-00200 (WLCSP-1.5x1.5 mm)"
    bus_interface: "I2C0 (400 kHz Fast-Mode)"
    i2c_address: { address_7bit: "TBD per Azoteq IQS127D datasheet; expected 0x34", reason: "Per electrical/sensor-interface.yaml section known_uncertainties; the datasheet is authoritative." }
    power_reset:
      supply_voltage_v: 1.8
      supply_rail: "VCC-1V8"
      reset_signal: "soft-reset via I2C (specific sequence per IQS127D datasheet; TBD)"
      power_on_sequence: "VCC-1V8 stable -> wait the IQS127D's start-up time (datasheet TBD) -> I2C transactions may begin"
    initialization_sequence:
      - "1. Wait for VCC-1V8 to be stable."
      - "2. Wait the IQS127D power-on delay (datasheet TBD)."
      - "3. Read the chip ID register (per IQS127D datasheet; TBD address). Expected value is in the datasheet."
      - "4. Configure the electrode count and channel map (per IQS127D datasheet; TBD). V1 uses 5-7 electrodes."
      - "5. Configure the touch thresholds (per IQS127D datasheet; TBD). V1 starting thresholds are engineering estimates; subject to hardware characterisation."
      - "6. Configure the scan rate (V1 target: 100 Hz; per protocol/gesture-vocabulary.yaml section global_constants)."
      - "7. Enable the INT GPIO output (active-low or active-high per IQS127D config; TBD)."
      - "8. Enable the IQS127D's built-in gesture engine for reference (the firmware does NOT trust it per protocol/gesture-vocabulary.yaml section recognition_pipeline stage 1 notes; the firmware re-runs recognition on the raw sample stream)."
      - "9. Transition to SELF_TEST (if available; TBD per IQS127D datasheet)."
    register_configuration:
      electrode_count_register: { address: "TBD per IQS127D datasheet", value: "5 to 7 (per the crown mechanical layout; TBD on mechanical/crown-layout.yaml)" }
      touch_threshold_register: { address: "TBD per IQS127D datasheet", value: "TBD; engineering start per IQS127D evaluation board defaults; subject to prototype characterisation" }
      scan_rate_register: { address: "TBD per IQS127D datasheet", value: "100 Hz target; exact register encoding TBD" }
      int_config_register: { address: "TBD per IQS127D datasheet", value: "TBD; INT asserted on touch event; active level TBD" }
      notes: "All register addresses and values TBD until the IQS127D datasheet is consulted."
    sampling_rate: { target_hz: 100, reason: "Per protocol/gesture-vocabulary.yaml section global_constants.touch_debounce_ms + section recognition_pipeline.stage_4. The IQS127D scans at 100 Hz; the firmware re-runs gesture recognition on the event stream." }
    measurement_range: { electrodes: "5 to 7 (per the crown layout)", output: "boolean per electrode + movement delta (TOUCH_MOVE reports from-to IDs)", notes: "The IQS127D reports touch events as a stream, not as continuous ADC readings; the firmware does NOT need raw capacitance values for gesture recognition." }
    resolution_data_format: { format: "event stream; each event is {TOUCH_PRESS | TOUCH_RELEASE | TOUCH_MOVE, electrode_id}; 1 byte per event in the simplest encoding (per firmware/architecture.md section 2.3 sm_sample_header_t)", notes: "The IQS127D's built-in gesture engine outputs higher-level events (TAP, SWIPE); the firmware treats these as informational only and re-runs recognition." }
    interrupt_behavior:
      int: { trigger: "any touch event (press, release, move)", wake_source: true, direction: "input to nRF54L15 GPIO; rising-edge (or falling-edge; TBD per IQS127D config)", notes: "Wakes the nRF54L15 from System ON idle and System OFF (per firmware/architecture.md section 8.2)." }
      latched_vs_pulsed: "TBD per IQS127D datasheet"
    fifo_requirements:
      fifo_events: "the IQS127D maintains its own event FIFO internally; the firmware drains it via I2C when INT asserts"
      external_buffer_size: "32 events x 16 bytes (per firmware/architecture.md section 12.1 touch event ring buffer); holds about 0.32 s at 100 Hz"
    timestamping_requirements:
      timestamp_source: "nRF54L15 RTC counter (per firmware/architecture.md section 2.3 common timestamping)"
      timestamping_in_driver: "the firmware stamps the timestamp at ISR (touch_isr); the IQS127D's internal timestamp is not used (per protocol/gesture-vocabulary.yaml section recognition_pipeline stage 1)"
      latency_to_publish_us: "< 50 (ISR -> sensor worker -> sm_publish)"
    calibration_procedure:
      type: "electrode baseline capacitance"
      when: "during boot if wear_state == WEAR_OFF and the ring has been still for at least 30 s; otherwise DEFERRED to the first WEAR_PUT_ON -> WEAR_TAKEN_OFF cycle"
      procedure: "sample each electrode for 2 seconds; store the median reading as the baseline; subtract from subsequent readings to detect touch"
      notes: "The baseline must be re-acquired after the ring is removed and the environment changes (e.g. temperature drift). The re-acquisition is triggered by WEAR_TAKEN_OFF."
    startup_self_test:
      available: "TBD per IQS127D datasheet; the IQS127D may have a built-in self-test for the electrodes"
      procedure: "TBD"
      pass_criterion: "TBD"
      duration_ms: "TBD"
    runtime_health_monitoring:
      monitored_signals: ["I2C ACK/NACK", "INT GPIO toggle rate plausibility", "false-positive touch rate"]
      thresholds: "all TBD on prototype characterisation"
    failure_behavior:
      on_failure: "disable the touch IC; the ring continues to operate with IMU-only gestures (ROTATE_*); a TEST_DIAGNOSTIC gesture event is emitted with the fault description"
      persistence: "fault_count_touch is persisted to flash"
    power_state_behavior:
      active_power_uA: 40
      sleep_power_uA: 0.5
      sleep_entry: "write IQS127D low-power register (per datasheet TBD)"
      wake_up: "any electrode touch event automatically wakes the IQS127D; the INT GPIO wakes the nRF54L15"
    firmware_abstraction:
      header_file: "drv_iqs127d.h (proposed; not yet created)"
      struct: "struct sm_touch_driver { sm_status_t (*init)(void); sm_status_t (*enable)(void); sm_status_t (*disable)(void); sm_status_t (*read_events)(sm_touch_event_t *out, uint16_t max_events); sm_status_t (*calibrate)(void); void (*irq_handler)(void); }"
      sensor_id_in_manager: "SM_SENSOR_TOUCH"
      ring_buffer_index: "touch_ring (per firmware/architecture.md section 12.1; 32 events x 16 bytes = 512 B)"
      drop_counter: "drop_count_touch (uint16; per firmware/architecture.md section 6.1)"

  sensor_tmp117:
    device_component: "Texas Instruments TMP117 (WCSP-1.5x1.5x0.5 mm)"
    bus_interface: "I2C0 (400 kHz Fast-Mode)"
    i2c_address: { address_7bit: "TBD per TI TMP117 datasheet; expected 0x48 (A0=GND)", reason: "Per electrical/sensor-interface.yaml section known_uncertainties; the datasheet is authoritative." }
    power_reset:
      supply_voltage_v: 1.8
      supply_rail: "VCC-1V8"
      reset_signal: "soft-reset via I2C (general-call reset per TMP117 datasheet; TBD)"
      power_on_sequence: "VCC-1V8 stable -> wait at least 1.5 ms (per TMP117 power-on timing; TBD on datasheet) -> I2C transactions may begin"
    initialization_sequence:
      - "1. Wait for VCC-1V8 to be stable."
      - "2. Wait the TMP117 power-on delay (datasheet TBD)."
      - "3. Read the chip ID register (per TMP117 datasheet; TBD address). Expected value is in the datasheet."
      - "4. Configure the conversion mode (one-shot vs continuous; V1 uses one-shot at 1 Hz)."
      - "5. Configure the averaging mode (per TMP117 datasheet; V1 uses the default). The averaging affects the noise floor and the active current."
      - "6. (Optional) configure the ALERT pin; V1 polls at 1 Hz so the ALERT is not strictly needed (per electrical/sensor-interface.yaml section gpio_allocation)."
      - "7. Transition to SELF_TEST (if available; TBD per TMP117 datasheet)."
      - "8. Start the first one-shot conversion (per firmware/architecture.md section 4: 1 Hz)."
    register_configuration:
      config_register: { address: "TBD per TMP117 datasheet (CONFIG)", value: "TBD; one-shot mode + averaging mode + alert polarity" }
      conversion_trigger: "writing to the CONFIG register with the OS bit triggers a one-shot conversion (per datasheet TBD)"
      notes: "All register addresses TBD until the TMP117 datasheet is consulted."
    sampling_rate: { target_hz: 1, reason: "Per firmware/architecture.md section 4 + electrical/system-architecture.yaml section blocks.Temperature. 1 Hz is sufficient for wear-state stillness detection + (V2) RR08 BLE exposure." }
    measurement_range: { range_c: [-55, 125], accuracy_c_pm: "TBD per TMP117 datasheet (engineering start: 0.1 C in the -20..50 C range; per components/temperature-selection.yaml)" }
    resolution_data_format: { resolution_c: 0.0078125, format: "16-bit signed; 1 LSB = 0.0078125 C; little-endian", notes: "Per components/temperature-selection.yaml; the TMP117's resolution is fixed by the datasheet." }
    interrupt_behavior:
      alert: { trigger: "temperature above high threshold or below low threshold", wake_source: false, direction: "input to nRF54L15 GPIO; open-drain; 10 kohm pull-up to VCC-1V8 (per electrical/sensor-interface.yaml)", notes: "The ALERT is optional in V1; the firmware polls at 1 Hz." }
    fifo_requirements: { external_buffer_size: "8 samples x 8 bytes (per firmware/architecture.md section 12.1 temperature sample buffer); 8 s at 1 Hz" }
    timestamping_requirements:
      timestamp_source: "nRF54L15 RTC counter"
      timestamping_in_driver: "the firmware stamps the timestamp when the conversion result is read; the TMP117's conversion time is part of the publish latency budget"
      latency_to_publish_ms: "< 5 (RTC compare -> sensor worker -> sm_publish)"
    calibration_procedure:
      type: "factory calibration only (the TMP117 is factory-calibrated per TI)"
      when: "no in-field calibration; the TMP117's accuracy is specified in the datasheet"
      notes: "Per components/temperature-selection.yaml; no in-field calibration is required for V1. Thermal isolation (the TMP117 is on the inner band, not inside the battery compartment) is the only environmental mitigation."
    startup_self_test:
      available: "TBD per TMP117 datasheet; the TMP117 may have a built-in self-test that validates the ADC"
      procedure: "TBD"
      pass_criterion: "TBD"
      duration_ms: "TBD"
    runtime_health_monitoring:
      monitored_signals: ["I2C ACK/NACK", "conversion result plausibility (within -40..85 C; readings outside this range are flagged)"]
      thresholds: "TBD on prototype characterisation"
    failure_behavior:
      on_failure: "disable the temperature sensor; a TEST_DIAGNOSTIC gesture event is emitted; the ring continues to operate (V1 does not depend on the temperature for any user-facing function; RR08 is V2-only)"
      persistence: "fault_count_temp is persisted to flash"
    power_state_behavior:
      active_power_uA: 3.5
      sleep_power_uA: 0.15
      sleep_entry: "write TMP117 CONFIG register to shutdown mode (per datasheet TBD)"
      wake_up: "write CONFIG register to one-shot mode to trigger a conversion"
    firmware_abstraction:
      header_file: "drv_tmp117.h (proposed; not yet created)"
      struct: "struct sm_temp_driver { sm_status_t (*init)(void); sm_status_t (*enable)(void); sm_status_t (*disable)(void); sm_status_t (*read)(sm_temp_sample_t *out); sm_status_t (*self_test)(void); }"
      sensor_id_in_manager: "SM_SENSOR_TEMP"
