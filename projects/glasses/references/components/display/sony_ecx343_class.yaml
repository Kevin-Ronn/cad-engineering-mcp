schema_version: 1
component:
  id: sony_ecx343_class_panel
  category: oled_microdisplay_panel_no_optics
  units: mm
  role: candidate_panel_for_custom_optical_engine

source:
  manufacturer: Sony Semiconductor Solutions
  part_number: ECX343-class (Sony's smaller micro-OLED panel family, 0.23-0.39 inch class)
  source_type: manufacturer_panel_only_no_reference_engine
  source_docs:
    - url: https://www.sony-semicon.co.jp/products/IS/sensor3.html
      description: "Sony Semiconductor Solutions microdisplay product line"
  notes: "Sony's ECX339A (0.5 inch 1600x1200) is publicly documented. The ECX343-class smaller panels (0.23-0.39 inch) are referenced in Sony's product line but full datasheets are gated by Sony and not publicly downloadable. The Sony OLED panel is the OLED; the optical engine (collimator + waveguide) is a separate, third-party design that pairs with the panel. There is no public reference engine that combines a 0.23 inch Sony ECX343-class OLED with a waveguide and ships as a buyable OEM module."

optical:
  display_technology: Sony micro-OLED (silicon-based OLED, top emission)
  resolution: NOT_PUBLIC for the 0.23 inch class; ECX339A class is 1600x1200
  diagonal_size_inch: 0.23 to 0.39 (class; exact class model not identified)
  aspect_ratio: NOT_PUBLIC for the 0.23 inch class
  fov_horizontal_deg: N/A (panel only; no engine)
  fov_vertical_deg: N/A
  waveguide_technology: N/A (panel only)
  waveguide_thickness_mm: N/A
  waveguide_dimensions_mm: N/A
  eyebox: N/A
  eye_relief_mm: N/A
  exit_pupil: N/A
  brightness_nits: NOT_PUBLIC (Sony micro-OLEDs are typically 1000-5000 nits)
  contrast: NOT_PUBLIC (typically > 10000:1 for Sony micro-OLEDs)
  colors: NOT_PUBLIC
  transparency_transmittance: N/A
  refresh_rate_hz: NOT_PUBLIC
  distortion: N/A
  focus_distance: N/A
  source_for_optical: manufacturer public catalog only

mechanical:
  display_panel_dimensions_mm: NOT_PUBLIC for the 0.23 inch class
  display_panel_weight_g: NOT_PUBLIC
  complete_module_dimensions_mm: N/A (panel only)
  source_for_mechanical: NOT_PUBLIC

electronics:
  interface: sub-LVDS or MIPI DSI (Sony micro-OLED driver interface; varies by panel)
  mipi_dsi_lanes: NOT_PUBLIC for the 0.23 inch class; Sony's micro-OLEDs are typically sub-LVDS, not native MIPI DSI
  controller_driver_ic: Sony CXD5600-class or similar; not confirmed for 0.23 inch class
  required_supply_voltages: NOT_PUBLIC
