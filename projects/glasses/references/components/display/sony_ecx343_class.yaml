purchase:
  distributor: Sony direct (gated; OEM sales only)
  unit_price_usd: NOT_PUBLIC (Sony micro-OLEDs are typically $50-200 for the panel alone, plus the optical engine cost)
  moq: typically 100+ for direct Sony sales
  lead_time: 8-12 weeks
  availability: production
  source_for_purchase: Sony Semiconductor Solutions direct

confidence:
  overall: LOW_for_glasses_integration
  sources: manufacturer_public_catalog_only
  gaps:
    - "No public datasheet for the 0.23 inch class"
    - "No public reference engine combining this panel with a waveguide"
    - "No public pricing"
    - "Sony's micro-OLED driver interface is typically sub-LVDS, requiring a bridge to the V853's MIPI DSI"
    - "No waveguide is included; a separate optical engine + waveguide must be designed and sourced"

constraints:
  status: NOT_RECOMMENDED_AS_PRIMARY — the panel is high quality but no turnkey optical engine + waveguide exists for the 0.23 inch 640x400 form factor that ships as a buyable OEM module.
  risk: "Designing a custom optical engine + waveguide around a Sony ECX343-class panel is a 6-12 month optical-mechanical engineering project with NRE cost in the $100k-500k range and a 6-12 month optical-tooling lead time. Out of scope for a glasses prototype."

geometry_relevance:
  conceptual_fit_against_wayfarer:
    note: "If a custom engine could be designed, the panel itself is small enough (sub-10 mm) to fit in the upper-bridge area. But the optical engine and waveguide are the larger items and require custom development."
    source_for_frame_comparison: projects/glasses/analysis/structure/full-mechanical-inspection.md
