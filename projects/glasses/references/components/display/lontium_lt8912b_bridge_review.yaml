constraints:
  status: ALTERNATIVE_BRIDGE — use only if the chosen LCoS engine requires RGB or LVDS input. The V853 DSI is the natural output; a bridge is only needed if the display engine does not accept DSI directly.
  use_case: "Most 0.23 640x400 micro-OLED panels accept MIPI DSI directly (no bridge). LCoS engines are more likely to need RGB / LVDS / sub-LVDS input, in which case the LT8912B is a candidate."
