constraints:
  status: EVALUATED_REJECTED_FOR_GLASSES
  evaluation: "The TC358870 converts HDMI-to-DSI, not a useful bridge for the glasses because the V853's native output is MIPI DSI (4-lane) — no bridge is needed. The bridge would be needed only if the display engine has an HDMI / LVDS / RGB input. Most 0.23 640x400 micro-OLED panels have MIPI DSI input directly (e.g. Sony ECX336-class)."

conclusion:
  - "V853 native MIPI DSI 4-lane output (1920 x 1200 @ 60 fps per datasheet section 1.3.5) is compatible with most 0.23 640x400 micro-OLED panels that have a MIPI DSI input."
  - "For a 0.23 640x400 micro-OLED with MIPI DSI input: V853 DSI 4-lane directly to the display; NO BRIDGE NEEDED."
  - "For an LCoS engine with parallel RGB / LVDS input: an RGB-to-DSI bridge would be needed (e.g. Toshiba TC358778, Lontium LT8912B, or ITE IT6505)."
  - "For a micro-OLED with sub-LVDS input (typical of Sony ECX336-class): a sub-LVDS-to-DSI bridge is needed (no widely-available commercial IC at this time; this is a custom design project)."
  - "The TC358870 is therefore EVALUATED_REJECTED for the glasses, unless a specific display engine with HDMI input is selected."
