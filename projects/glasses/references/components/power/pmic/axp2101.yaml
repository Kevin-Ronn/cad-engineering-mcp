constraints:
  status: SERIOUS_PRIMARY — AXP2101 is the Allwinner-ecosystem PMIC and is proven with the V853 in the ProjectYosemite reference design. All required V853 rails are present. The package (5 x 5 mm QFN-32) is on the larger side for a glasses compute PCB, but the compute PCB lives in the temple, not in the front frame, so 5 x 5 mm is fine.
