schema_version: 1
system_signal_map:
  id: v853_smart_glasses_signal_map
  date: 2026-09-05
  source: cross-referenced against the V853 datasheet (v853-datasheet.pdf), ProjectYosemite reference design, and the chosen components in the audio/camera/display/power/imu/support reference libraries
  confidence: HIGH for interface-to-peripheral mapping; LOW for specific V853 ball assignments (see UNKNOWN below)

  v853_peripheral_inventory:
    note: "From the V853 datasheet section 1.3 (architecture) and 1.3.x (peripherals). Each peripheral is a separate V853 IP block with a configurable ball assignment."

    - peripheral: MIPI CSI (Camera Serial Interface)
      count: 1 IP block
      configurations: "1x 4-lane OR 2x 2-lane (per datasheet section 1.3.6.4)"
      protocol: MIPI CSI-2 V1.1, D-PHY V1.1
      per_lane_data_rate: up to 1.2 Gbps
      glasses_target: 2x 2-lane sub-channels (one per camera)
      v853_ball_assignment: UNKNOWN (per datasheet section 2.2; must be assigned by the glasses PCB)

    - peripheral: MIPI DSI (Display Serial Interface)
      count: 1 IP block
      configurations: 4-lane
      protocol: MIPI DSI V1.02, D-PHY V1.2
      per_lane_data_rate: up to 1.0 Gbps
      max_resolution: 1920 x 1200 @ 60 fps
      glasses_target: 4-lane to the monocular micro-OLED/waveguide display
      v853_ball_assignment: UNKNOWN

    - peripheral: SMHC (SD Host Controller)
      count: 3 SMHC blocks
      protocol: SDIO 3.0 / eMMC 5.1
      glasses_target: "SMHC0 -> eMMC 5.1; SMHC1 -> SDIO Wi-Fi (XR829 / RTL8821CU / AW-CM276SM)"
      v853_ball_assignment: UNKNOWN

    - peripheral: USB 2.0 DRD (Dual-Role Device)
      count: 1
      protocol: USB 2.0
      glasses_target: USB-C receptacle (charging + data)
      v853_ball_assignment: UNKNOWN

    - peripheral: I2S / PCM
      count: 2
      protocol: I2S / PCM (Philips I2S, left/right-justified, PCM, TDM)
      sample_rates_khz: 8 to 384
      glasses_target: I2S0 or I2S1 to MAX98390 / MAX98357A / TAS2770 audio amplifier
      v853_ball_assignment: UNKNOWN

    - peripheral: DMIC (Digital PDM Microphone)
      count: 1
      protocol: PDM (single-bit data + clock)
      max_mics: 8 (stereo per mic, software-selectable L/R)
      glasses_target: DMIC -> MP23DB01HP microphone
      v853_ball_assignment: UNKNOWN

    - peripheral: I2C / TWI (Two-Wire Interface)
      count: 5
      protocol: I2C (Standard, Fast, Fast-Plus)
      glasses_target: "TWI0 -> shared bus (IMU, ALS, 2x TMP117, MAX17048, BQ25185, AXP2101); TWI1 -> reserved / haptic driver if needed"
      v853_ball_assignment: UNKNOWN
      note: "All 5 TWI controllers are independent. The shared I2C bus requires a 4.7 kohm pull-up to 1.8 V on SDA and SCL."

    - peripheral: SPI (Serial Peripheral Interface)
      count: 4
      protocol: SPI (master / slave, up to 50 MHz per typical AHB APB class)
      glasses_target: "Reserved for debug / optional haptic driver / future expansion. The IMU is I2C-only in the primary configuration."
      v853_ball_assignment: UNKNOWN

    - peripheral: UART
      count: 4
      protocol: UART (up to 4 Mbaud)
      glasses_target: "UART0 -> Bluetooth HCI (XR829-class or AW-CM276SM-class); UART1 -> debug console"
      v853_ball_assignment: UNKNOWN

    - peripheral: PWM
      count: 12
      glasses_target: "PWM0 -> optional backlight / IR LED brightness; PWM1 -> haptic drive (if LRA chosen)"
      v853_ball_assignment: UNKNOWN

    - peripheral: GPIO
      count: 8 banks (per datasheet section 1.3.8)
      glasses_target: "IMU INT1/INT2, ALS INT, IR LED enable, haptic enable, user button, status LED, fuel-gauge INT, charger INT, AXP2101 IRQ, USB-C VBUS detect"
      v853_ball_assignment: UNKNOWN

    - peripheral: GPADC (General Purpose ADC)
      count: 4
      glasses_target: "Optional: battery voltage sense, NTC thermistor backup, microphone peak detect. The TMP117 covers temperature."
      v853_ball_assignment: UNKNOWN

    - peripheral: Audio Codec (on-die)
      description: "1x DAC, 2x ADC, 2x differential mic inputs, 1x differential line out (per datasheet section 1.3.7.1)"
      glasses_target: "NOT used. The DAC and line out are not connected; the I2S-based external class-D amplifier (MAX98390) drives the speakers directly. The on-die ADC is not used because the microphone is a digital PDM mic."

    - peripheral: EMAC (Ethernet)
      count: 1
      glasses_target: "NOT used (no Ethernet in glasses)."

  signal_map_tree:
    V853:
      CSI0:
        - "Camera 1 (left) -> 2-lane MIPI CSI-2 sub-channel (D0/D1, clock, I2C control, GPIO reset/standby)"
        - "Camera 2 (right) -> 2-lane MIPI CSI-2 sub-channel (D0/D1, clock, I2C control, GPIO reset/standby)"
      DSI0:
        - "Display -> 4-lane MIPI DSI (D0-D3, clock, TE GPIO, reset GPIO, backlight-enable GPIO)"
      SMHC0:
        - "eMMC 5.1 -> 8 data lines, 1 clock, 1 command, reset, power-on"
      SMHC1:
        - "Wi-Fi/BT module (SDIO Wi-Fi) -> SDIO 2.0 (or 3.0; 4 data lines, clock, command)"
      UART0:
        - "Bluetooth HCI (UART) -> TX, RX, RTS, CTS, host-wake, device-wake"
      UART1:
        - "Debug console -> TX, RX"
      TWI0:
        shared_i2c_bus:
          - "BMI270 IMU (0x68 or 0x69) -> SDA, SCL, INT1, INT2"
          - "VEML7700 ALS (0x10) -> SDA, SCL, INT"
          - "TMP117 left (0x48-0x4B) -> SDA, SCL, ALERT"
          - "TMP117 right (0x48-0x4B, different address) -> SDA, SCL, ALERT"
          - "MAX17048 fuel gauge (0x36) -> SDA, SCL, ALERT"
          - "BQ25185 charger (0x6A or similar) -> SDA, SCL, INT"
          - "AXP2101 PMIC (0x34 or 0x35) -> SDA, SCL, IRQ"
      TWI1:
        reserved_for_haptic_or_debug
      SPI0:
        reserved_for_debug_or_optional_haptic
      DMIC0:
        - "MP23DB01HP microphone -> PDM_DATA, PDM_CLK"
      I2S0:
        - "Audio amplifier left (MAX98390) -> BCLK, LRCLK, DIN (amp SDOUT unused)"
      I2S1:
        - "Audio amplifier right (MAX98390) -> BCLK, LRCLK, DIN (amp SDOUT unused)"
      USB0:
        - "USB-C receptacle (charging + data) -> USB_DP, USB_DN, VBUS, CC1, CC2, GND"
      PWM0:
        - "Optional backlight or IR LED brightness control"
      PWM1:
        - "Optional haptic drive (if 8 mm LRA is included)"
      GPIO:
        - IMU_INT1
        - IMU_INT2
        - ALS_INT
        - fuel_gauge_ALERT
        - charger_INT
        - AXP2101_IRQ
        - camera1_reset
        - camera1_standby
        - camera2_reset
        - camera2_standby
        - display_TE
        - display_reset
        - display_backlight_enable
        - IR_LED_enable
        - IR_LED_5V_boost_enable
        - user_button
        - status_LED
        - haptic_enable
        - VBUS_detect
      GPADC0:
        - "Optional: NTC thermistor backup (the TMP117 covers temperature)"
      GPADC1:
        - "Optional: battery voltage sense backup (the AXP2101 and MAX17048 cover this)"
      GPADC2:
        - "Unused"
      GPADC3:
        - "Unused"

  shared_i2c_bus_topology:
    address_allocation:
      - { device: "BMI270 IMU", address_7bit: "0x68 or 0x69 (configurable)", note: "IMU interrupt-driven; INT1 and INT2 connect to V853 GPIO" }
      - { device: "VEML7700 ALS", address_7bit: "0x10 (fixed)", note: "Interrupt-driven; INT connects to V853 GPIO" }
      - { device: "TMP117 left", address_7bit: "0x48", note: "Alert pin connects to V853 GPIO" }
      - { device: "TMP117 right", address_7bit: "0x49", note: "Alert pin connects to V853 GPIO" }
      - { device: "MAX17048 fuel gauge", address_7bit: "0x36 (configurable)", note: "Alert pin connects to V853 GPIO" }
      - { device: "BQ25185 charger", address_7bit: "0x6A or 0x6B (per TI family)", note: "INT pin connects to V853 GPIO" }
      - { device: "AXP2101 PMIC", address_7bit: "0x34 (X-Powers convention)", note: "IRQ pin connects to V853 GPIO" }
    pull_ups: "4.7 kohm on SDA and SCL to 1.8 V"
    speed: "Standard I2C (100 kHz) or Fast-Mode (400 kHz). Use Fast-Mode for IMU and ALS which need higher data rate."

  v853_peripheral_conflict_check:
    smhc0_vs_smhc1: "SMHC0 = eMMC; SMHC1 = SDIO Wi-Fi. No conflict (different IP blocks; different balls per datasheet section 2.2)."
    csi0_2lane_vs_2lane: "Both cameras on 2-lane sub-channels of CSI0. Per the V853 datasheet, this is supported (1x 4-lane OR 2x 2-lane). No conflict; both sub-channels are independent virtual channels."
    dsi0: "Single DSI IP. Only one display. No conflict."
    i2s0_vs_i2s1: "Two I2S controllers; one per speaker. No conflict."
    twi0_shared: "TWI0 is shared across 7 devices. The bus is 100/400 kHz; all devices support this. The bus is the master -> slave only; the V853 is the master. No conflict in protocol."
    uart0_bluetooth: "UART0 dedicated to Bluetooth HCI. No conflict with UART1 debug."
    pwm0_backlight_pwm1_haptic: "Two separate PWM channels. No conflict."
    gpio_count: "8 GPIO banks; the glasses design needs ~20 GPIO functions. Each GPIO bank typically has 8-16 pins; the glasses design fits within the 8 banks. No conflict."
    usb_dp_dn_vbus_cc1_cc2: "USB 2.0 DRD is a single IP; the USB-C receptacle uses DP, DN, VBUS, CC1, CC2, GND. No conflict."
    dmic0: "Single DMIC IP. 1 mic fits. No conflict."
    overall: "No peripheral-multiplexing conflicts identified. The V853 has sufficient IP blocks for the glasses feature set."

  unknown_v853_ball_assignments:
    note: "The V853 datasheet (v853-datasheet.pdf) section 2.2 contains the full pin map. The glasses PCB must assign the specific SoC ball to each peripheral. The ProjectYosemite reference board has a different feature set and a different ball map. The glasses PCB will need a new ball map that fits the dual-temple, dual-camera, monocular-display feature set. This work is the NEXT STEP and is NOT part of this reference-acquisition pass."
    specific_balls_UNKOWN:
      - "CSI0_D0P, CSI0_D0N, CSI0_D1P, CSI0_D1N, CSI0_CLKP, CSI0_CLKN"
      - "DSI0_D0P, DSI0_D0N, DSI0_D1P, DSI0_D1N, DSI0_D2P, DSI0_D2N, DSI0_D3P, DSI0_D3N, DSI0_CLKP, DSI0_CLKN"
      - "SMHC0_D0-D7, SMHC0_CLK, SMHC0_CMD, SMHC0_RSTN"
      - "SMHC1_D0-D3, SMHC1_CLK, SMHC1_CMD"
      - "USB0_DP, USB0_DN"
      - "I2S0_BCLK, I2S0_LRCK, I2S0_DIN"
      - "I2S1_BCLK, I2S1_LRCK, I2S1_DIN"
      - "DMIC0_DATA, DMIC0_CLK"
      - "TWI0_SDA, TWI0_SCL, TWI1_SDA, TWI1_SCL"
      - "UART0_TX, UART0_RX, UART0_RTS, UART0_CTS, UART1_TX, UART1_RX"
      - "PWM0, PWM1, ... PWM11"
      - "GPIO PA0-PA15, PB0-PB15, PC0-PC15, ... PH0-PH15"
      - "GPADC0, GPADC1, GPADC2, GPADC3"
    all_above_UNKOWN_for_this_pass: "Per the brief, the V853 pin map is in the datasheet section 2.2; this reference-acquisition pass has not yet extracted specific ball numbers. The next pass (PCB design) must do this."
