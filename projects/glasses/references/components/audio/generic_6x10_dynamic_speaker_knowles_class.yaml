constraints:
  status: REJECTED_FOR_GLASSES_USE_CASE — the 6 x 10 mm hearing-aid class is tuned for in-ear canal use with the wearer's ear canal as a sealed back-volume. In a glasses-temple pod, the back-volume is too large and the resonance is wrong. The 15 x 11 mm (or 16 x 9 mm) dynamic class is the right form factor for glasses. The 6 x 10 mm class is included here for reference only.
