constraints:
  status: ALTERNATIVE — integrated boost means the amplifier can run from a 3.6 V Li-ion rail and produce 6.1 W into 4 ohm (overkill for the glasses) without a separate boost converter. The integrated DSP speaker protection is a real plus for small speakers that can be over-driven. 2.0 x 2.0 mm package is between MAX98390 (1.33) and MAX98357A (3.0).
  v853_connection: "I2S BCLK, LRCLK, DIN connect directly to V853 I2S0 or I2S1. I2C control bus shares the TWI0 bus. No level shifter needed if I/O voltage is 1.8 V (verify)."
