  glasses_use_case: "Wi-Fi 4 is acceptable for the V853 use profile (local preprocessing + connectivity to phone). BT for initial pairing / fallback. The antenna is on the SoM PCB; if the SoM is fully enclosed in a metal-shielded frame, the antenna must be relocated or an external u.FL antenna added."

