      note: "The MIPI CSI data and clock pins (CSI_D0P/N, CSI_D1P/N, CSI_D2P/N, CSI_D3P/N, CSI_CLKP/N) are defined in the SoC pinctrl dtsi (sun8iw21p1-pinctrl.dtsi or similar) which is NOT publicly available. The 100ASK dts references '&ncsi_pins_a' but does not enumerate the pins. The 'csi_mclk0/1/2' pins (PA12, PA13, PE1) are the CSI master clocks, not the data/clock lanes. The sensor0_reset (PA18) and sensor0_pwdn (PA19) are GPIO controls, not data/clock. The sensor1_power_en (PI0) and sensor1_reset (PH13) are also GPIO controls."
      glasses_candidate: "CSI data and clock pins are NOT publicly enumerable. The glasses' design needs 2x 2-lane MIPI CSI-2 sub-channels (per the V853 datasheet section 1.3.6.4 '1x 4-lane / 2x 2-lane'). The public source confirms: (a) CSI MCLK0 is on PA12, (b) CSI MCLK1 is on PA13, (c) CSI MCLK2 is on PE1 (for the second CSI controller, nCSI). The IMX708 sensor does NOT require an external MCLK (per the IMX708 datasheet), so MCLK pins are not strictly needed but can be used as GPIO if desired. The actual data and clock pins (CSI_D0P/N .. CSI_CLKP/N) are in the SoC pinctrl dtsi (NOT publicly available). The 100ASK reference's ncsi_pins_a is a label; the underlying pins are in the SoC pinctrl dtsi. The glasses' design must wait for the .sls file or the SoC pinctrl dtsi to know the exact data/clock pin assignments."
