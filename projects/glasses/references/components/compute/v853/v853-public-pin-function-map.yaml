  summary_of_mux_conflicts_found_in_public_source:
    - conflict: "I2S0 (PH0-PH4) vs DMIC (PH0-PH4) vs UART3 (PH0-PH1)"
      sources: ["src-1 line 581 (UART3 PH0-PH1)", "src-1 line 775 (DMIC PH0-PH4)", "src-1 line 791 (I2S0 PH0-PH4)"]
      resolution: "100ASK resolves this by disabling DMIC and using I2S0 for audio. The glasses' design needs DMIC AND I2S0. The glasses' design must use I2S0 on a DIFFERENT pin set (per the SoC pinctrl dtsi) to avoid this conflict."
      impact: "BLOCKS the simple I2S0 / DMIC coexistence. Requires the SoC pinctrl dtsi to find an alternative I2S0 pin set."
    - conflict: "SDC2 (eMMC, PC0-PC11) vs SPI0 (PC0-PC5)"
      sources: ["src-1 line 595 (SPI0 PC0-PC5)", "src-2 line 279 (SDC2 PC0-PC11)"]
      resolution: "100ASK resolves this by disabling SPI0 in the kernel dts and using SDC2 only in U-Boot for boot. The glasses' design must do the same: enable SDC2 in U-Boot for eMMC boot, disable SPI0 in the kernel dts."
      impact: "The glasses' design does not need SPI NOR flash, so disabling SPI0 is acceptable."
    - conflict: "I2S1 (PE7-PE11) vs GMAC0 (PE0-PE15, 16 pins)"
      sources: ["src-1 line 807 (I2S1 PE7-PE11)", "src-1 line 865 (GMAC0 PE0-PE15)"]
      resolution: "100ASK has GMAC0 enabled. The glasses' design must disable GMAC0 in the device tree to free PE7-PE11 for I2S1."
      impact: "The glasses' design does not need Ethernet, so disabling GMAC0 is acceptable."
    - conflict: "RGB LCD (PD0-PD21 or PD0-PD27) is the same pin range as some V853 GPIO banks"
      sources: ["src-1 line 940 (RGB18 PD0-PD21)", "src-2 line 661 (RGB24 PD0-PD27)"]
      resolution: "100ASK uses RGB LCD for its display. The glasses' design uses MIPI DSI, not RGB. Disable RGB LCD in the device tree to free PD0-PD21 (or PD0-PD27) for GPIO."
      impact: "Acceptable; the glasses' design does not need RGB LCD."

  system_block_diagram_reference:
    file: "projects/glasses/references/components/system-block-diagram.md"
    note: "The block diagram is consistent with the assignments above. The TWI4 (PI1, PI2) for the shared 7-device I2C bus, UART2 (PE10-PE13) for Bluetooth HCI, SDC2 (PC0-PC11) for eMMC, SDC1 (PG0-PG5) for SDIO Wi-Fi, I2S1 (PE7-PE11) for the right speaker MAX98390, and USB0 for the USB-C receptacle are consistent with the public source."

  overall_status:
    public_pin_function_coverage: "APPROXIMATELY 70% of the glasses' pin assignment is publicly verifiable. The remaining 30% (CSI data/clock pins, DSI data/clock pins, USB DP/DN, specific GPIO balls, specific boot mode pins, specific RESET ball) is NOT publicly enumerable without the SoC pinctrl dtsi or the V853/V853S_PINOUT.sls file."
    physical_bga_ball_coverage: "ZERO. The V853 datasheet does not contain the per-ball pin map; the SoC pinctrl dtsi is NOT publicly available; the V853/V853S_PINOUT.sls file is the only public path to per-ball data, and it is NDA-only."
    pcb_routing_readiness: "FALSE. The PCB cannot be routed with per-ball precision until the V853/V853S_PINOUT.sls is obtained from Allwinner under NDA."
    peripheral_block_readiness: "TRUE. The peripheral block assignment (which controller, which mux function) is verified from the public source. The mux conflicts are identified. The chosen pin set (per the 100ASK reference) is documented. The glasses' design can use the 100ASK pin choices as a starting point and migrate to other choices once the SoC pinctrl dtsi is available."
