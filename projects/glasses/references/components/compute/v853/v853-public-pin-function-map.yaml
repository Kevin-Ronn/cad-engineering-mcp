        - { board: "100ASK V853-Pro kernel (csi_mclk)", source: "src-1 line 887-939", csi_mclk0: "PA12 mipi_csi_mclk0", csi_mclk1: "PA13 mipi_csi_mclk1", csi_mclk2: "PE1 ncsi_mclk", status: VERIFIED }
