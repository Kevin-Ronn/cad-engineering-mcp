schema_version: 1
i2c_bus_audit:
  id: v853_i2c_bus_audit
  date: 2026-09-05
  source: each device's datasheet (or datasheet summary) for the 7-bit I2C address; the V853 has 5 TWI controllers per datasheet section 1.3.8

  conclusion:
    single_bus_feasible: YES
    all_addresses_unique: YES
    all_devices_1v8_compatible: YES
    confidence: HIGH

  proposed_i2c_bus:
    bus_id: TWI0
    v853_peripheral: V853 TWI0
    speed_khz: 400 (Fast-Mode; 100 kHz Standard also supported)
    voltage: 1.8 V (VCC-PA or similar GPIO bank, configured for 1.8 V)
    pull_ups: 4.7 kohm to 1.8 V on SDA and SCL (one set for the whole bus)
    note: "All chosen devices support 1.8 V IO; pull-ups are to 1.8 V."

  per_device_address:

    - { device: "BMI270 IMU", address_7bit: "0x68 (SDO = GND) or 0x69 (SDO = VDD)", address_configurable: "via SDO pin on the IMU package; the two glasses-design BMI270s (one per temple is NOT needed; one is sufficient; see the IMU README) can use 0x68", final_address: "0x68", note: "single IMU is sufficient for the glasses; the address is selected by the SDO pin strap on the BMI270 package", datasheet_source: "BMI270 datasheet" }
    - { device: "VEML7700 ALS", address_7bit: "0x10 (fixed by VEML7700)", address_configurable: "no", final_address: "0x10", note: "VEML7700 has a fixed 7-bit address; no alternative", datasheet_source: "Vishay VEML7700 datasheet" }
    - { device: "TMP117 left (temple)", address_7bit: "0x48 (A0 = GND)", address_configurable: "via A0 pin (4 possible addresses: 0x48, 0x49, 0x4A, 0x4B)", final_address: "0x48", note: "TMP117 has 4 address options; the left temple uses 0x48", datasheet_source: "TI TMP117 datasheet" }
    - { device: "TMP117 right (temple)", address_7bit: "0x49 (A0 = VDD)", address_configurable: "via A0 pin", final_address: "0x49", note: "TMP117 has 4 address options; the right temple uses 0x49", datasheet_source: "TI TMP117 datasheet" }
    - { device: "MAX17048 fuel gauge", address_7bit: "0x36 (configurable via I2C address register; the default after power-up is 0x36)", address_configurable: "yes, via the ADD pin and a software address register; the default is 0x36 and the data sheet recommends 0x36 for the typical use", final_address: "0x36", note: "MAX17048 can be set to 0x36, 0x0C, or a custom address via the I2C address register; 0x36 is the default and works for the glasses", datasheet_source: "ADI MAX17048 datasheet" }
    - { device: "BQ25185 charger", address_7bit: "0x6A (default for BQ25185; the address is configurable via the I2C address register; the default after power-up is 0x6A)", address_configurable: "yes, via the I2C address register; the default is 0x6A", final_address: "0x6A", note: "BQ25185 has 8 possible I2C addresses; 0x6A is the default; no collision with the other 6 devices", datasheet_source: "TI BQ25185 datasheet" }
    - { device: "AXP2101 PMIC", address_7bit: "0x34 (default for AXP2101; X-Powers convention)", address_configurable: "yes, via the I2C address register; the default is 0x34", final_address: "0x34", note: "AXP2101 default 7-bit address is 0x34 (per X-Powers convention; the ProjectYosemite EPCB confirms 0x34)", datasheet_source: "AXP2101 datasheet" }

  address_collision_check:
    all_proposed_addresses: ["0x68", "0x10", "0x48", "0x49", "0x36", "0x6A", "0x34"]
    unique_count: 7
    collisions: 0
    conclusion: "NO collisions. All 7 devices can share one I2C bus at 0x34 / 0x36 / 0x48 / 0x49 / 0x10 / 0x6A / 0x68."

  per_device_voltage:
    bmi270: 1.8 V (per BMI270 datasheet; VDD 1.71-3.6 V; the VDDIO is 1.8 V when the VCC-PA bank is at 1.8 V)
    veml7700: 2.5-3.6 V supply; but I/O is compatible with 1.8 V via the VEML7700's I2C bus which is open-drain and pulled up to 1.8 V externally (verify in the VEML7700 datasheet)
    tmp117: 1.7-5.5 V supply; 1.8 V I/O compatible
    max17048: 2.5-4.5 V supply; I2C is 1.8 V compatible per the MAX17048 datasheet (the MAX17048's SDA/SCL are 1.8 V tolerant when the REG output is configured for 1.8 V; verify)
    bq25185: 1.8-5.5 V supply; 1.8 V I/O compatible
    axp2101: 2.7-5.5 V supply; 1.8 V I/O compatible
    note: "All 7 devices are 1.8 V I/O compatible. The I2C bus is 1.8 V pulled up. This is a known-good configuration."

  per_device_speed:
    bmi270: I2C up to 1 MHz (Fast-Mode Plus)
    veml7700: I2C up to 400 kHz (Fast-Mode)
    tmp117: I2C up to 1 MHz (Fast-Mode Plus)
    max17048: I2C up to 400 kHz
    bq25185: I2C up to 1 MHz
    axp2101: I2C up to 1 MHz
    common_speed: 400 kHz (Fast-Mode) is supported by all 7 devices. Use 400 kHz as the bus speed.

  per_device_interrupt:
    bmi270: "INT1 and INT2; both are push-pull or open-drain to VCC-IO; the SoC configures them. Connect INT1 to a V853 GPIO with interrupt capability."
    veml7700: "INT pin; open-drain; connect to a V853 GPIO with interrupt capability."
    tmp117: "ALERT pin; open-drain; connect to a V853 GPIO with interrupt capability. Use 2 GPIO lines (one per temple)."
    max17048: "ALERT pin; open-drain; connect to a V853 GPIO with interrupt capability."
    bq25185: "INT pin; open-drain; connect to a V853 GPIO with interrupt capability."
    axp2101: "IRQ pin; open-drain; connect to a V853 GPIO with interrupt capability."
    total_interrupt_lines: 7 (one per device). The V853 has 8 GPIO banks with 16 pins each; 7 interrupts is well within capacity.

  per_device_reset:
    bmi270: "RESET_N pin; active low. Optional; the BMI270 has a software reset via the command register."
    veml7700: "No reset pin. The device powers up in the default state."
    tmp117: "No reset pin. The device powers up in the default state."
    max17048: "No reset pin. The device powers up in the default state."
    bq25185: "No reset pin. The device powers up in the default state."
    axp2101: "RESET pin; active low. Required to hold the AXP2101 in reset during SoC boot; the AXP2101 releases the SoC's RESET line after the rails are up."
    note: "Only the BMI270 (optional) and the AXP2101 (required) have reset pins. The AXP2101 reset is critical for the V853's power-on sequence."

  if_collision_or_voltage_mismatch:
    address_collision: "very unlikely (all 7 addresses are unique); if it occurs, use the address-configuration pins (A0 for TMP117, SDO for BMI270, ADD for MAX17048, I2C address register for BQ25185 / AXP2101) to select an alternative address"
    voltage_mismatch: "very unlikely (all 7 devices are 1.8 V I/O); if it occurs, use a TXS0102-class level shifter on the I2C SDA / SCL lines"
    second_bus: "V853 has 4 more TWI controllers (TWI1..TWI4). If needed, a second bus can be used for power-supply-critical devices (e.g. charger + PMIC) and a first bus for sensors."
    mux: "TCA9543A or PCA9543A I2C mux is a fallback if an address conflict cannot be resolved. 4-channel, 1.65-5.5 V, I2C-controlled."

  linux_driver_support:
    bmi270: "mainline IIO driver (bmi160 / bmi270)"
    veml7700: "mainline IIO driver (veml7700)"
    tmp117: "mainline IIO driver (tmp117)"
    max17048: "mainline power-supply class driver (max17048_battery)"
    bq25185: "mainline power-supply class driver (bq25620 / bq2518x family)"
    axp2101: "mainline MFD driver (axp20x; supports the AXP2101 via the axp20x-pek / axp20x-regulator / axp20x-adc / axp20x-battery drivers)"
    confidence: "HIGH (all 7 devices have mainline Linux drivers)"

  summary:
    single_bus_feasible: true
    address_collisions: 0
    voltage_compatible: true
    speed_common: 400 kHz
    interrupt_lines_needed: 7
    reset_lines_needed: 1 (AXP2101)
    recommended_topology: "single TWI0 bus; all 7 devices on the bus; 7 GPIO interrupts; 1 GPIO reset (AXP2101)"
