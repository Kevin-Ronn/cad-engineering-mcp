geometry_relevance:
  fit_assessment: "If a 'mini' 24 x 25 mm Arducam IMX462 module exists, it is comparable to the RPi Camera Module 3 in size and would face the same mechanical fit constraints."
  ocr_suitability: "2.9 um pixel is significantly larger than IMX708 (1.4 um), giving 4x the per-pixel SNR. For low-light and OCR, this is a stronger sensor than the IMX708. However, only 2 MP total — at the standard lens FOV, license-plate OCR distance is limited to ~2-3 m. 1080p @ 120 fps is excellent for video."

constraints:
  status: SERIOUS_CANDIDATE — best low-light candidate; better than IMX708 for night-vision / IR-illuminated scenes; but lower resolution limits OCR distance. Recommend a specific Arducam SKU with documented dimensions before adoption.
