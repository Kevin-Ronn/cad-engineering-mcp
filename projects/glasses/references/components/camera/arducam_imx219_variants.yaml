geometry_relevance:
  fit_assessment: "If the 24 x 25 mm form factor is correct for the mini variants, the PCB envelope is comparable to the RPi Camera Module 3. Same mechanical fit constraints apply."

constraints:
  status: SERIOUS_CANDIDATE — cheap, well-known, many lens options. The 1.12 um pixel is smaller than IMX708 (1.4 um) so the per-pixel noise is higher and the low-light performance is worse. Rolling shutter is the same as the IMX708. Acceptable for a budget option, not preferred over the IMX708 for OCR and low-light.

  ocr_suitability: "1.12 um pixel and 8 MP resolution is adequate for license-plate OCR at very close range (1-3 m) but the smaller pixel reduces low-light SNR. For glasses use, prefer a module with a larger pixel."
