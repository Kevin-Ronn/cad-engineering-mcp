      status: PROVISIONAL
      physical_bga_ball: UNKNOWN
      notes: "The V853 has 8 GPIO banks (PA, PB, PC, PD, PE, PF, PG, PH, PI) with approximately 128 GPIO total. The glasses' design uses approximately 20 GPIO functions plus 2 PWM channels. The specific bank-to-function mapping is in the SoC pinctrl dtsi (NOT publicly available). The chosen banks must be 1.8 V or 3.3 V per the VCC-PA / VCC-PC / VCC-PD / VCC-PE / VCC-PG / VCC-PI power domains. The glasses' design uses 1.8 V for all chosen banks."

  peripherals_NOT_USED:
    - peripheral: GMAC0 (RGMII Ethernet)
      reason: "Glasses do not need Ethernet. The 100ASK reference uses PE0..PE15 for GMAC0 RGMII; the glasses' design disables GMAC0 in the device tree to free PE0..PE15 for I2S1 (PE7..PE11) and other GPIO."
    - peripheral: SPI0 (SPI NOR flash)
      reason: "Glasses do not need SPI NOR flash. eMMC is the boot device. The 100ASK reference uses PC0..PC5 for SPI0; the glasses' design disables SPI0 in the device tree to free PC0..PC5 for SDC2 (eMMC, which also uses PC0..PC11)."
    - peripheral: SPI1 (SPI DBI for display)
      reason: "Glasses use MIPI DSI, not SPI DBI. The 100ASK reference uses PH5..PH9 for SPI1; the glasses' design disables SPI1 in the device tree."
    - peripheral: SPIF0 (SPI flash controller)
      reason: "Same as SPI0. The 100ASK reference uses PF20..PF31 for SPIF0; the glasses' design disables SPIF0."
    - peripheral: RGB LCD (RGB18, RGB24 parallel output)
      reason: "Glasses use MIPI DSI, not RGB parallel. The 100ASK reference uses PD0..PD27 for RGB18/RGB24; the glasses' design disables the RGB LCD controller in the device tree to free PD0..PD27 for GPIO (these can be used for IR LED enable, haptic enable, etc.)."
    - peripheral: On-die audio codec
      reason: "Glasses use external I2S-based MAX98390 amplifiers. The on-die audio codec is bypassed. The PA pin (PH4) is not used."
    - peripheral: SDC0 (SD card)
      reason: "Glasses do not need an SD card slot. SMHC0 is used for eMMC; SMHC1 is used for SDIO Wi-Fi. The 100ASK reference uses SDC0 / SMHC0 for the SD card; the glasses' design disables SDC0 (or uses it for a different SMHC assignment per the SoC pinctrl dtsi)."
    - peripheral: GPADC (general purpose ADC)
      reason: "Glasses do not need the general-purpose ADC. The TMP117 temperature sensors cover the thermal monitoring need. The 100ASK reference uses the GPADC for 5-key keypad; the glasses' design uses a GPIO-based user button."
    - peripheral: Wiegand
      reason: "Glasses do not need Wiegand (the Wiegand protocol is for RFID readers). The 100ASK reference enables Wiegand on PH13/PH14; the glasses' design disables Wiegand."
    - peripheral: UART3
      reason: "Glasses use UART0 for debug console and UART2 for Bluetooth HCI. UART1 is reserved. UART3 is on PH0/PH1 which conflicts with DMIC and I2S0; the glasses' design disables UART3."
    - peripheral: S_TWI0 (Secure TWI)
      reason: "Glasses do not need the secure TWI. The 100ASK reference uses PL0/PL1 (Port L) for s_twi0; the glasses' design disables s_twi0. NOTE: Port L (PL) is a separate GPIO bank from PA..PI; it has its own power domain."

  summary:
    total_v853_peripherals_in_use: 13
    total_v853_peripherals_NOT_in_use: 11
    v853_signal_count_for_glasses: approximately 60 (CSI 12 + DSI 11 + eMMC 13 + SDIO 6 + UART 7 + I2S 6 + DMIC 2 + I2C 2 + USB 4 + GPIO ~22 + reset 1 + boot 1)
    status_summary:
      VERIFIED_peripheral_blocks: 13 / 13 (all chosen peripherals exist in the V853 datasheet)
